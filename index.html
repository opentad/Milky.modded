<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Милки — Моя страница</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--cy:#0ad1f8;--hd:#2ccbea;--tx:#34404e;--mu:#9aa1a9;--ln:#eef1f5;--pl:#f1fcff;--sq:#eef7fc;--bt:#17b3e6;--ok:#3b8f2f}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{font-family:'Montserrat',system-ui,sans-serif;background:#f9f9f9;color:var(--tx);display:flex;min-height:100vh;font-size:13px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
svg{display:block;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
img{display:block}

/* боковая панель */
.rail{position:sticky;top:0;align-self:flex-start;height:100vh;width:72px;flex:none;background:#fff;display:flex;flex-direction:column;align-items:center;padding-top:34px;border-radius:0 19px 19px 0;box-shadow:0 0 30px rgba(0,0,0,.05);z-index:5;cursor:pointer}
.logo{height:32px;font-weight:800;font-size:23px;line-height:32px;color:#2d6a9f}
.ava{width:30px;height:30px;border-radius:50%;background:#fde4e4;overflow:hidden;flex:none}
.ava img{width:100%;height:100%;object-fit:cover}
.rail .ava{margin-top:36px}
.rail hr{width:30px;border:0;border-top:1px solid #ebedf0}
.rail hr.h1{margin-top:133px}
.rail hr.h2{margin-top:14px}
.ri{width:48px;height:48px;display:grid;place-items:center;color:#777}
.ri svg{width:17px;height:17px}
.rail .first{margin-top:9px}
.shade{position:fixed;inset:0;background:rgba(15,25,35,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:10}
.drawer{position:fixed;top:0;left:0;bottom:0;width:287px;max-width:88vw;background:#fff;z-index:11;transform:translateX(-102%);transition:transform .25s;overflow-y:auto;padding:36px 0 30px;border-radius:0 19px 19px 0;box-shadow:8px 0 40px rgba(0,0,0,.08);text-align:center}
.menu .shade{opacity:1;pointer-events:auto}
.menu .drawer{transform:none}
.brand{position:relative;display:inline-block;font-weight:800;font-size:22px;line-height:26px;letter-spacing:1px;color:#1c5ba6}
.brand i{position:absolute;right:-12px;top:-5px;width:11px;height:11px;border:2px solid #f59a1f;border-radius:50%}
.brand small{display:block;font-size:6px;line-height:6px;letter-spacing:0;margin-top:-1px}
.drawer .ava{width:61px;height:61px;margin:35px auto 0}
.dname{font-size:14px;line-height:16px;color:#6b7280;margin-top:3px}
.coins{display:flex;gap:14px;justify-content:center;align-items:center;margin-top:26px;font-size:17px;color:#555}
.coin{display:inline-block;width:19px;height:19px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe27a,#f0a500);margin-right:5px;vertical-align:-4px}
.bell{position:relative;color:#777}
.bell svg{width:18px;height:18px}
.bd2{position:absolute;right:-6px;bottom:-5px;min-width:13px;height:13px;border-radius:7px;background:#e5314a;color:#fff;font-size:8px;font-weight:600;line-height:13px;text-align:center}
.bd2.cy{background:var(--cy)}
.dv{height:1px;background:#eceef1;margin:30px 52px 0}
.sl{text-align:left;font-size:9.5px;letter-spacing:1px;color:#b3b9bf;padding:11px 52px 3px;text-transform:uppercase}
.mi{display:flex;align-items:center;gap:14px;width:100%;height:48px;padding-left:47px;font-size:13.3px;color:#7b838c;text-align:left}
.mi svg{width:17px;height:17px;flex:none}
.mi:active{background:var(--pl)}

/* основная часть */
.main{flex:1;min-width:0;padding:38px 52px 0}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap}
.cap{font-size:9px;color:#a5a8ac}
h1{font-weight:300;font-size:26.5px;line-height:1.05;color:#4d4d4d;margin-top:6px}
.sw{background:var(--cy);color:#fff;border-radius:18px;height:36px;padding:0 20px;font-weight:600;font-size:13px}
.sec{font-size:14.5px;font-weight:400;color:var(--hd);margin:22px 0 14px}
.card{background:#fff;border-radius:25px;box-shadow:0 6px 30px rgba(0,0,0,.04);padding:22px}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:4px}
.hd h2{font-size:15px;font-weight:400;color:var(--hd)}
.hd span{font-size:9.5px;color:var(--mu)}
.hd2{font-size:9.5px;color:var(--mu);margin-bottom:14px}

/* карточки уроков */
.today{display:flex;gap:8px;flex-wrap:wrap}
.lc{width:254px;background:#fff;border-radius:20px;box-shadow:0 6px 30px rgba(0,0,0,.04);overflow:hidden;text-align:center;padding-bottom:18px}
.ban{height:179px;position:relative;background:linear-gradient(160deg,#ffe8c8,#fdd9a8) center/cover no-repeat;display:grid;place-items:center;font-size:70px}
.ban b{position:absolute;top:44px;left:0;right:0;font-size:18px;font-weight:800;color:#e8793a;text-transform:uppercase;padding:0 10px}
.tg{position:absolute;left:14px;top:14px;background:#fff;border-radius:14px;padding:0 13px;height:28px;line-height:28px;font-size:12.5px;font-weight:600;color:var(--tx)}
.lc h3{font-size:19.5px;font-weight:700;margin:16px 8px 8px}
.tm{display:flex;gap:7px;justify-content:center;align-items:center;font-size:14.5px;font-weight:600;color:#4a5563;margin-bottom:17px}
.tm svg{width:14px;height:14px;color:#8a929b}
.lc .info{font-size:12px;color:var(--mu);margin:-8px 0 14px}
.join,.soon{display:block;margin:0 auto;width:180px;height:36px;border-radius:18px;font-weight:600;font-size:14px}
.join{background:var(--cy);color:#fff}
.soon{border:1.5px solid #c4e9f6;color:#8fcfe6}
.rest{background:#fff;border-radius:20px;padding:20px 22px;color:#6b7580;font-size:13px;box-shadow:0 6px 30px rgba(0,0,0,.04);display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.start{display:flex;align-items:center;gap:8px;background:var(--cy);color:#fff;border-radius:18px;height:36px;padding:0 20px;font-weight:600;font-size:14px}
.start svg{width:15px;height:15px}

/* список и карточки */
.bar{height:9.5px;border-radius:5px;background:#edf2f6;overflow:hidden;flex:1}
.bar i{display:block;height:100%;background:var(--cy);width:0;transition:width .25s}
.it{display:flex;align-items:center;gap:14px;border:1px solid var(--ln);border-radius:17px;padding:0 14px 0 18px;min-height:75px;background:#fff;margin-bottom:11px}
.it .ico{flex:none;width:42px;height:42px;border-radius:11px;background:var(--sq);color:var(--cy);display:grid;place-items:center;font-size:19px}
.it .ico svg{width:14px;height:14px}
.it>div{flex:1;min-width:0}
.it b{display:block;font-size:16px;font-weight:600;line-height:1.25}
.it small{display:block;color:var(--mu);font-size:11px;margin-top:2px}
.it small strong{font-weight:600;color:#6b7580}
.tag2{display:inline-block;background:#eef1f4;border-radius:9px;padding:1px 8px;font-size:9.5px;font-weight:500;margin-left:6px;vertical-align:2px;color:#6b7580}
.go{flex:none;height:36px;padding:0 17px;background:var(--pl);color:var(--bt);border-radius:18px;font-weight:700;font-size:12px}
.go.ok{background:#e7f6e5;color:var(--ok)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:25px;align-items:start;margin-top:18px}
.cl-m{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.cl-m span{font-size:12.5px;color:#8b929a}
.cl-m b{font-size:13px;font-weight:600}
.gr{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:22px}
.gc{background:#fff;border-radius:19px;padding:16px;box-shadow:0 6px 30px rgba(0,0,0,.04)}
.gt{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.gt small{display:block;color:var(--mu);font-size:12px}
.gt b{display:block;font-size:21px;font-weight:600;color:#12c6f4;margin-top:6px}
.mark{flex:none;width:44px;height:44px;border-radius:50%;background:var(--ok);color:#fff;font-weight:700;font-size:18px;display:grid;place-items:center}
.mark.m4{background:var(--cy)}
.gd{display:flex;gap:12px;align-items:center;margin-top:12px}
.gd div{flex:1;background:#f4f6f8;border-radius:11px;padding:9px 14px}
.gd small{display:block;color:var(--mu);font-size:10.8px}
.gd b{font-size:15.8px;font-weight:600}
.gd span{flex:none;width:35px;height:35px;border-radius:12px;background:var(--sq);color:var(--cy);display:grid;place-items:center}
.gd svg{width:15px;height:15px}
.nav{display:flex;gap:10px;justify-content:flex-end}
.dt{height:29px;padding:0 15px;border:1px solid #12c6f4;border-radius:9px;color:#12c6f4;font-weight:500;font-size:12.5px;background:#fff;display:inline-flex;align-items:center;gap:6px}
.dt svg{width:13px;height:13px}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.dc{background:#fff;border-radius:25px;box-shadow:0 6px 30px rgba(0,0,0,.04);padding:16px 14px 14px}
.dh{display:flex;justify-content:space-between;align-items:center;padding:0 4px 10px;border-bottom:1px solid var(--ln);margin-bottom:10px}
.dh b{font-size:17px;font-weight:600;color:var(--hd)}
.bd{background:#eef1f4;border-radius:12px;padding:3px 9px;font-size:10.5px;color:#7a838c}
.ls{display:flex;gap:10px;align-items:center;border:1px solid var(--ln);border-radius:14px;padding:8px;margin-bottom:8px}
.tp{flex:none;width:53px;border-radius:11px;background:var(--pl);text-align:center;padding:6px 0;line-height:1.2}
.tp b{display:block;font-size:13px;font-weight:700;color:var(--bt)}
.tp small{font-size:9.5px;color:var(--mu)}
.ls div:last-child{min-width:0}
.ls strong{font-size:13px;font-weight:700}
.ls span.t{display:inline-block;background:var(--pl);color:var(--bt);border-radius:9px;padding:1px 7px;font-size:9px;font-weight:600;margin-left:5px;vertical-align:1px}
.ls small{display:block;font-size:10.5px;color:var(--mu);margin-top:2px}
.fr{font-size:11.5px;color:#9aa5b0;padding:10px 4px}
.foot{margin:46px -52px 0;padding:34px 52px 46px;border-top:1px solid #ececec;font-size:12.7px;letter-spacing:.4px;color:#9aa1a9;text-transform:uppercase}

/* экран выбора */
.pick{min-height:calc(100vh - 76px);display:flex;flex-direction:column}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:10px}
.sc{background:#fff;border-radius:16px;padding:6px 6px 9px;text-align:center;box-shadow:0 4px 20px rgba(0,0,0,.04);border:2px solid transparent}
.sc.on{border-color:var(--cy)}
.sb{height:78px;border-radius:11px;background:linear-gradient(160deg,#ffe8c8,#fdd9a8) center/cover no-repeat;display:grid;place-items:center;font-size:30px;margin-bottom:6px}
.sc b{display:block;font-size:11px;font-weight:600;line-height:1.2}
.sc small{font-size:10px;color:var(--mu)}
.tl{display:flex;align-items:center;gap:14px;margin:18px 0 6px}
.tl strong{font-size:13px;font-weight:600;white-space:nowrap}
.sh{font-size:15px;font-weight:600;margin:18px 0 10px}
.days{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;flex:1;align-content:start}
.dd{background:#fff;border-radius:20px;padding:14px;box-shadow:0 6px 30px rgba(0,0,0,.04)}
.dd b{display:block;font-size:15px;font-weight:600;color:var(--hd)}
.dd .tmx{font-size:20px;font-weight:700;margin:8px 0 2px}
.dd small{display:block;color:var(--mu);font-size:11px;margin-bottom:10px}
.pick-b{width:100%;height:36px;border-radius:18px;background:var(--pl);color:var(--bt);font-weight:700;font-size:12.5px}
.pick-b.on{background:var(--cy);color:#fff}
.pick-b:disabled{background:#f3f5f7;color:#b7c0c8;cursor:not-allowed}
.low{color:#d97706!important}
.rd{padding:34px 0 90px}
.rd h2{font-size:17px;font-weight:600;color:var(--hd);margin-bottom:14px}
.back{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1.5px solid var(--cy);color:var(--cy);border-radius:18px;height:36px;padding:0 18px;font-weight:600;font-size:13px;margin-bottom:6px}
.back svg{width:15px;height:15px}
.fab{position:fixed;right:24px;bottom:23px;height:44px;padding:0 28px;border-radius:22px;background:var(--cy);color:#fff;font-weight:700;font-size:14px;box-shadow:0 6px 20px rgba(10,209,248,.35);z-index:4}
.fab:disabled{background:#e9eef2;color:#a9b2bb;box-shadow:none}
.chat{position:fixed;right:13px;bottom:23px;width:58px;height:58px;border-radius:50%;background:#12c6f4;color:#fff;display:grid;place-items:center;box-shadow:0 6px 20px rgba(18,198,244,.35);z-index:4}
.chat svg{width:26px;height:26px}
.mod{position:fixed;inset:0;background:rgba(15,25,35,.4);display:grid;place-items:center;z-index:20;padding:20px}
.mbox{background:#fff;border-radius:25px;padding:28px 30px;max-width:420px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2)}
.mbox h3{font-size:19px;font-weight:700;margin-bottom:10px}
.mbox p{font-size:13px;color:#566170;line-height:1.5;margin-bottom:22px}
.mbox div{display:flex;gap:12px;justify-content:center}
.mbox button{height:38px;min-width:110px;border-radius:19px;color:#fff;font-weight:700;font-size:14px}
.yes{background:var(--ok)}
.no{background:var(--cy)}

@media(max-width:1100px){.row2{grid-template-columns:1fr}}
@media(max-width:640px){.main{padding:30px 16px 0}.foot{margin:40px -16px 0;padding:28px 16px 40px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="shade" id="shade"></div>
<aside class="drawer" id="drawer"></aside>
<nav class="rail" id="rail"></nav>

<main class="main">
  <!-- ГЛАВНАЯ -->
  <section id="v-home">
    <div class="top">
      <div><div class="cap">Моя страница</div><h1 id="hello"></h1></div>
      <button class="sw" id="sw"></button>
    </div>
    <h2 class="sec">Занятия на сегодня</h2>
    <div class="today" id="today"></div>

    <div id="stu">
      <div class="row2">
        <section class="card">
          <div class="hd"><h2>Чек-лист дня</h2></div>
          <div class="cl-m"><div class="hd2" style="margin:0;flex:1">Подготовка к учебному дню</div><span>Выполнено</span><div class="bar" style="max-width:260px"><i id="cl-bar"></i></div><b id="cl-n"></b></div>
          <div id="cl"></div>
        </section>
        <section class="card">
          <div class="hd"><h2>Домашние задания</h2><span>Все домашние задания ›</span></div>
          <div class="hd2">Актуальные задания на сегодня</div>
          <div id="hw"></div>
        </section>
      </div>
      <div class="hd" style="margin-top:22px"><h2 class="sec" style="margin:0">Оценки</h2><span>Мой дневник ›</span></div>
      <div class="gr" id="gr" style="margin-top:14px"></div>
    </div>

    <div id="tea" hidden>
      <h2 class="sec">Темы недели</h2>
      <div id="topics"></div>
    </div>

    <div id="sched" hidden>
      <div class="hd" style="margin-top:22px"><h2 class="sec" style="margin:0">Расписание занятий</h2><div class="nav"><button class="dt">Назад</button><button class="dt">Далее</button></div></div>
      <div class="wk" id="week" style="margin-top:14px"></div>
    </div>
    <footer class="foot">Milky School 2026</footer>
  </section>

  <!-- ВЫБОР -->
  <section id="v-pick" hidden>
    <div class="pick">
      <h2 class="sec" style="margin-top:0">Выбери уроки</h2>
      <div class="subs" id="subs"></div>
      <div class="tl"><strong id="tleft"></strong><div class="bar"><i id="tfill"></i></div></div>
      <div class="sh" id="sh"></div>
      <div class="days" id="days"></div>
      <div class="tl"><strong id="sleft"></strong><div class="bar"><i id="sfill"></i></div></div>
    </div>
    <div class="rd"><h2>Готовое расписание</h2><div class="wk" id="ready"></div></div>
  </section>

  <!-- ПРОВЕРКА -->
  <section id="v-review" hidden>
    <button class="back" id="back"><svg viewBox="0 0 24 24"><path d="M12 6l-6 6 6 6M19 6l-6 6 6 6"/></svg>Назад</button>
    <div class="rd" style="padding-top:20px"><h2>Готовое расписание</h2><div class="wk" id="rv"></div></div>
  </section>

  <section id="v-hw" hidden></section>
  <section id="v-sim" hidden></section>
</main>

<button class="fab" id="done" hidden>Готово</button>
<button class="fab" id="approve" hidden>Утвердить расписание</button>
<button class="chat" id="chat" aria-label="Чат поддержки"></button>
<div class="mod" id="mod" hidden><div class="mbox"><h3>Вы уверены?</h3><p id="mtext"></p><div><button class="yes" id="yes">Да</button><button class="no" id="no">Нет</button></div></div></div>

<script>
/* Модуль домашних заданий: страница ДЗ, симуляции, тесты, сдача */
(function(){
const $=s=>document.querySelector(s);
const css=document.createElement('style');
css.textContent=`
#v-hw,#v-sim{padding-bottom:80px}
.crumb{font-size:12px;color:#a5a8ac;margin-bottom:16px}.crumb a{cursor:pointer}
.hero{display:flex;gap:22px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(120deg,#fff 40%,#d9f4fd);border-radius:25px;padding:24px;box-shadow:0 6px 30px rgba(0,0,0,.04)}
.hero small{color:var(--bt);font-weight:600;font-size:13px}
.hero h1{font-weight:800;color:#34404e;font-size:34px;margin:6px 0 14px}
.chp{display:inline-block;background:#f1fcff;border-radius:16px;padding:9px 16px;font-weight:600;font-size:13px;margin:0 8px 8px 0;color:#566170}
.ban2{width:290px;height:165px;border-radius:18px;background:linear-gradient(160deg,#ffe8c8,#fdd9a8) center/cover;display:grid;place-items:center;font-size:60px}
.stc{width:220px;background:#fff;border-radius:20px;padding:18px;text-align:center;font-size:12px;color:var(--mu)}
.stc b{display:block;font-size:15px;color:#4a5563;margin-bottom:8px}
.stc i{display:grid;place-items:center;width:46px;height:46px;border-radius:50%;background:var(--pl);color:var(--cy);font-style:normal;font-size:22px;font-weight:700;margin:0 auto 8px}
.stc.g i{background:var(--ok);color:#fff}.stc.r i{background:#9aa5b0;color:#fff}
.hg{display:grid;grid-template-columns:1.15fr 1fr;gap:22px;margin-top:22px;align-items:start}
.hg .card{margin-bottom:22px}
.card h2.t{font-size:22px;font-weight:800;color:#34404e;margin-bottom:4px}
.txt{background:#f9fafc;border-radius:17px;padding:18px 22px;line-height:1.7;font-size:14px;margin:14px 0}
.mats{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.mats button{width:150px;text-align:left;font-size:11px;color:var(--mu)}
.mats img{width:150px;height:110px;object-fit:cover;object-position:top;border-radius:12px;margin-bottom:4px}
.lbl{font-weight:600;font-size:13px;margin:14px 0 8px}
.ed{border:1px solid #dfe5ea;border-radius:12px;overflow:hidden}
.ed .tb{padding:10px 16px;border-bottom:1px solid #e7ecf0;font-size:15px;color:#566170}
.ed textarea{width:100%;height:170px;border:0;padding:14px;font:inherit;resize:vertical;outline:0}
.fl{border:1px dashed #cfe9f3;background:#f8fcfe;border-radius:17px;padding:18px;margin-top:16px}
.fl small{display:block;color:var(--mu);margin:2px 0 12px}
.up{background:#fff;border-radius:12px;text-align:center;padding:14px;color:var(--bt);font-weight:600;margin-bottom:10px}
.dz{border:1.5px dashed #bfe6f3;border-radius:12px;padding:34px 12px;text-align:center;color:#566170;font-weight:500}
.bt{display:block;width:100%;height:46px;border-radius:14px;background:#12b3e8;color:#fff;font-weight:700;font-size:15px;margin-top:16px}
.bt.gn{background:#2fbf5a}
.note{margin-top:16px;padding:14px;border-radius:14px;background:var(--pl);color:#566170;text-align:center}

const progress=id=>{const d=dd(id);return [d.sims.filter(k=>simDone(id,k)).length+(d.test&&get(id).tdone?1:0),d.sims.length+(d.test?1:0)]};

const grade=id=>{const s=get(id);s.status='graded';s.date=tdate();if(cur===id&&!$('#v-hw').hidden)render();changed()};

}

function modal(html){const m=document.createElement('div');m.className='mod';m.style.zIndex=30;m.innerHTML=html;m.addEventListener('click',e=>{if(e.target===m)m.remove()});document.body.appendChild(m);return m}

document.addEventListener('click',e=>{
  const t=e.target,b=k=>t.closest(k);

function openSim(k){
  const m=SIM[k],s=get(cur);if(!s.sim[k])s.sim[k]=m.m.map(()=>false);
  MS.show('sim');
  $('#v-sim').innerHTML=frame(m.t,m.d)+'<div class="sg"><section class="card" id="sr"></section><section class="card"><h2 class="t" style="font-size:18px">Задания</h2><div id="ml"></div></section></div>';
  const ml=()=>{$('#ml').innerHTML=m.m.map((x,i)=>`<div class="mi2${s.sim[k][i]?' d':''}"><i>${s.sim[k][i]?'✓':''}</i>${x}</div>`).join('')+(s.sim[k].every(Boolean)?'<div class="note">Симуляция пройдена! Вернись к заданию.</div>':'')};
  ml();leave();
  destroy=m.mount($('#sr'),{ok:i=>{if(!s.sim[k][i]){s.sim[k][i]=true;ml();changed()}}});

   q.k==='m'?q.o.map((o,j)=>`<label><input type="checkbox" data-q="${i}" data-j="${j}"${(s.ans[i]||[]).includes(j)?' checked':''}>${o}</label>`).join(''):
   `<div class="opts">${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" data-q="${i}" data-j="${j}"${s.ans[i]===j?' checked':''}>${ang(o)}<span>${'АБВГ'[j]}</span></label>`).join('')}</div>`}</div>`).join('')}<button class="bt gn" id="tf">Завершить тест</button></section>`;
  $('#v-sim').oninput=$('#v-sim').onchange=e=>{const i=e.target.dataset.q;if(i===undefined)return;const q=d.test[i];

  r.addEventListener('click',e=>{const b=e.target.closest('[data-r]');if(b)sel(+b.dataset.r,1)});sel(0);

    x.textAlign='center';x.font='50px serif';for(let k=0;k<4;k++)x.fillText('🌳',sx(k*350),120);
    x.fillText('🚌',sx(p(1)),150);x.font='24px serif';x.fillText('🧍',sx(p(2)),128);x.font='44px serif';x.fillText('🚗',sx(p(3)),205);
    x.font='bold 13px Montserrat,sans-serif';x.fillStyle='#e8793a';const rx=ref===0?sx(0):sx(p(ref));x.fillText('▼ ты',rx,ref===3?140:ref===2?100:ref===1?85:55)});
}};

SIM.touch={e:'🪱',t:'Потрогай гидру',d:'Коснись гидры иглой и посмотри, как сигнал бежит по нервной сети. Это рефлекс!',m:['Дотронься до тела гидры','Дотронься до щупальца','Включи нервную сеть и дотронься снова'],
mount(r,c){
  const [cv,x]=mk(r,420,340),CX=210,B=300;let net=false,wave=null,seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const N=Array.from({length:34},()=>({u:rnd(),v:rnd()}));

  cv.onpointerdown=e=>{const p=pt(cv,e);if(Math.abs(p.x-CX)>110||p.y<40||p.y>B)return;wave={x:p.x,y:p.y,t:performance.now()};
    const top=B-180;if(p.y>=top&&Math.abs(p.x-CX)<40)c.ok(0);else if(p.y<top)c.ok(1);if(net)c.ok(2)};

    const tt=wave?(performance.now()-wave.t)/1000:99,k=tt>.5&&tt<2.1?1-.5*Math.sin(Math.PI*(tt-.5)/1.6):1,top=B-180*k,rad=tt*260;
    x.strokeStyle='#4aa86a';x.lineWidth=7;x.lineCap='round';for(let i=0;i<6;i++){const o=(i-2.5);x.beginPath();x.moveTo(CX+o*9,top);x.quadraticCurveTo(CX+o*30,top-40*k,CX+o*42,top-75*k);x.stroke()}
    x.fillStyle='#bfe8c9';x.strokeStyle='#4aa86a';x.lineWidth=5;x.beginPath();x.roundRect(CX-32,top,64,B-top,16);x.fill();x.stroke();
    x.fillStyle='#8fd0a5';x.beginPath();x.ellipse(CX,B+4,46,10,0,0,7);x.fill();
    if(net){const P=N.map(n=>({x:CX-24+n.u*48,y:top+8+n.v*(B-top-16)}));x.lineWidth=1;
      P.forEach((a,i)=>P.forEach((b,j)=>{if(j>i&&Math.hypot(a.x-b.x,a.y-b.y)<42){const lit=wave&&Math.hypot(a.x-wave.x,a.y-wave.y)<rad&&tt<2;x.strokeStyle=lit?'#e5314a':'#4a90c9';x.beginPath();x.moveTo(a.x,a.y);x.lineTo(b.x,b.y);x.stroke()}}));

  let op='+';

  const dr=()=>{$('#eq').textContent=f(...q);$('#es').innerHTML=E.map((e,j)=>`<button class="${j===i?'on':''}" data-e="${j}">${f(...e)}</button>`).join('');r.querySelectorAll('[data-o]').forEach(b=>b.classList.toggle('on',b.dataset.o===op))};

SIM.draw={e:'📐',t:'Построй и измерь',d:'Проведи линию (тяни пальцем или мышью). Построй перпендикуляр в точке A и измерь угол транспортиром.',m:['Построй прямую AB','Построй в точке A перпендикуляр','Измерь угол транспортиром'],
mount(r,c){
  const [cv,x]=mk(r,700,360),L=[];let cu=null,pr=false;const sn=v=>Math.round(v/20)*20;
  r.insertAdjacentHTML('beforeend','<div class="chips"><button id="pb">Транспортир</button><button id="cb">Очистить</button><b id="rd" style="margin-left:8px"></b></div>');
  const vert=()=>{if(L.length<2)return L[0]?L[0].a:null;const [p,q]=[L[0],L[1]],d1={x:p.b.x-p.a.x,y:p.b.y-p.a.y},d2={x:q.b.x-q.a.x,y:q.b.y-q.a.y},den=d1.x*d2.y-d1.y*d2.x;if(Math.abs(den)<1e-6)return p.a;const t=((q.a.x-p.a.x)*d2.y-(q.a.y-p.a.y)*d2.x)/den;return {x:p.a.x+t*d1.x,y:p.a.y+t*d1.y}};
  const far=(l,v)=>Math.hypot(l.a.x-v.x,l.a.y-v.y)>Math.hypot(l.b.x-v.x,l.b.y-v.y)?l.a:l.b;
  const angle=()=>{const V=vert();if(!V||L.length<2)return null;const p=L[0].b,q=far(L[1],V),a=Math.atan2(p.y-V.y,p.x-V.x),b=Math.atan2(q.y-V.y,q.x-V.x);let d=Math.abs(a-b)*180/Math.PI;if(d>180)d=360-d;return d};
  const check=()=>{if(L.length>=1)c.ok(0);if(L.length>=2){const d=angle(),A=L[0].a,l=L[1],len=Math.hypot(l.b.x-l.a.x,l.b.y-l.a.y),dist=Math.abs((l.b.x-l.a.x)*(l.a.y-A.y)-(l.a.x-A.x)*(l.b.y-l.a.y))/len;if(Math.abs(d-90)<3&&dist<8)c.ok(1)}if(pr&&L.length>=2)c.ok(2)};
  cv.onpointerdown=e=>{const p=pt(cv,e);cu={a:{x:sn(p.x),y:sn(p.y)},b:{x:sn(p.x),y:sn(p.y)}};cv.setPointerCapture(e.pointerId)};
  cv.onpointermove=e=>{if(!cu)return;const p=pt(cv,e);cu.b={x:sn(p.x),y:sn(p.y)}};
  cv.onpointerup=()=>{if(cu&&Math.hypot(cu.b.x-cu.a.x,cu.b.y-cu.a.y)>=40){if(L.length>=2)L.length=0;L.push(cu);check()}cu=null};
  r.onclick=e=>{if(e.target.id==='pb'){pr=!pr;check()}if(e.target.id==='cb'){L.length=0;pr=false}};
  return raf(()=>{x.fillStyle='#fff';x.fillRect(0,0,700,360);x.strokeStyle='#dbeef5';x.lineWidth=1;for(let i=0;i<=700;i+=20){x.beginPath();x.moveTo(i,0);x.lineTo(i,360);x.stroke()}for(let i=0;i<=360;i+=20){x.beginPath();x.moveTo(0,i);x.lineTo(700,i);x.stroke()}
    x.lineCap='round';[...L,...(cu?[cu]:[])].forEach(l=>{x.strokeStyle='#34404e';x.lineWidth=3;x.beginPath();x.moveTo(l.a.x,l.a.y);x.lineTo(l.b.x,l.b.y);x.stroke()});
    x.fillStyle='#e8793a';x.font='bold 16px Montserrat,sans-serif';if(L[0]){x.fillText('A',L[0].a.x-14,L[0].a.y-8);x.fillText('B',L[0].b.x+8,L[0].b.y-8)}
    const V=vert(),rd=$('#rd'),a=angle();
    if(pr&&V&&L.length>=1){const p=L[0].b,rot=Math.atan2(p.y-V.y,p.x-V.x);x.save();x.translate(V.x,V.y);x.rotate(rot);x.fillStyle='rgba(10,209,248,.15)';x.strokeStyle='#0ad1f8';x.lineWidth=2;x.beginPath();x.arc(0,0,120,-Math.PI,0);x.closePath();x.fill();x.stroke();
      x.font='10px sans-serif';x.fillStyle='#17b3e6';for(let d=0;d<=180;d+=10){const t=-d*Math.PI/180;x.beginPath();x.moveTo(Math.cos(t)*(d%30?112:104)*1,Math.sin(t)*(d%30?112:104));x.lineTo(Math.cos(t)*120,Math.sin(t)*120);x.stroke();if(d%30===0)x.fillText(d,Math.cos(t)*88-8,Math.sin(t)*88+4)}x.restore()}
    rd.textContent=pr?(a===null?'Построй вторую линию':'Угол между лучами: '+Math.round(a)+'°'):''});
}};

SIM.robot={e:'🤖',t:'Робот-алгоритмист',d:'Составь программу из команд, чтобы робот дошёл до флажка. Команда «3×⬆» повторяет шаг три раза.',m:['Уровень 1','Уровень 2','Уровень 3 (со стенами)'],
mount(r,c){
  const LV=[{s:[0,5],g:[0,2],w:[]},{s:[0,5],g:[3,2],w:[]},{s:[0,5],g:[4,0],w:[[0,3],[2,2],[3,5]]}];let lv=0,prog=[],run=null;
  const [cv,x]=mk(r,300,300);cv.style.maxWidth='300px';
  r.insertAdjacentHTML('beforeend','<div class="chips" id="lv"></div><div class="chips">'+[['f','⬆ вперёд'],['l','↶ налево'],['r','↷ направо'],['m','3×⬆'],['x','Очистить'],['go','▶ Запустить']].map(b=>`<button data-c="${b[0]}">${b[1]}</button>`).join('')+'</div><div class="fb" id="pg"></div><div class="fb" id="rm"></div>');
  let rb={x:0,y:5,d:0};const reset=()=>{const L=LV[lv];rb={x:L.s[0],y:L.s[1],d:0};clearInterval(run);$('#rm').textContent='';$('#lv').innerHTML=LV.map((_,j)=>`<button class="${j===lv?'on':''}" data-l="${j}">Уровень ${j+1}</button>`).join('')};
  const show=()=>{$('#pg').textContent='Программа: '+(prog.map(p=>({f:'⬆',l:'↶',r:'↷',m:'3×⬆'}[p])).join(' ')||'пусто')};
  const step=cmd=>{const D=[[0,-1],[1,0],[0,1],[-1,0]],L=LV[lv];if(cmd==='l')rb.d=(rb.d+3)%4;else if(cmd==='r')rb.d=(rb.d+1)%4;else{const n=cmd==='m'?3:1;for(let i=0;i<n;i++){const nx=rb.x+D[rb.d][0],ny=rb.y+D[rb.d][1];if(nx<0||ny<0||nx>5||ny>5||L.w.some(w=>w[0]===nx&&w[1]===ny)){$('#rm').className='fb bad';$('#rm').textContent='Стена! Робот не может пройти.';return}rb.x=nx;rb.y=ny}}};
  r.onclick=e=>{const b=e.target.closest('button');if(!b)return;
    if(b.dataset.l!==undefined){lv=+b.dataset.l;prog=[];reset();show()}
    else if(b.dataset.c==='x'){prog=[];reset();show()}
    else if(b.dataset.c==='go'){reset();let i=0;run=setInterval(()=>{if(i>=prog.length){clearInterval(run);const L=LV[lv];if(rb.x===L.g[0]&&rb.y===L.g[1]){$('#rm').className='fb ok2';$('#rm').textContent='Флажок достигнут!';c.ok(lv)}else{$('#rm').className='fb bad';$('#rm').textContent='Не дошёл. Попробуй изменить программу.'}return}step(prog[i++])},450)}
    else if(b.dataset.c){prog.push(b.dataset.c);show()}};
  reset();show();
  return raf(()=>{const L=LV[lv];x.fillStyle='#fff';x.fillRect(0,0,300,300);x.strokeStyle='#cfe9f3';for(let i=0;i<=6;i++){x.beginPath();x.moveTo(i*50,0);x.lineTo(i*50,300);x.moveTo(0,i*50);x.lineTo(300,i*50);x.stroke()}
    x.textAlign='center';x.font='30px serif';L.w.forEach(w=>x.fillText('🧱',w[0]*50+25,w[1]*50+36));x.fillText('🚩',L.g[0]*50+25,L.g[1]*50+36);x.fillText('🤖',rb.x*50+25,rb.y*50+36);
    x.font='bold 14px sans-serif';x.fillStyle='#e8793a';x.fillText(['▲','▶','▼','◀'][rb.d],rb.x*50+25,rb.y*50+12)});
}};

 ['Аккаунт',[['user','Профиль'],['exit','Выход']]]];
const AVA='<img src="ava.jpg" alt="">';
$('#rail').innerHTML='<button class="logo" aria-label="Меню">M</button><button class="ava" aria-label="Меню">'+AVA+'</button><hr class="h1">'+
  RAIL.map((k,i)=>`<button class="ri${i?'':' first'}" aria-label="${k}">${ic(k)}</button>`).join('')+'<hr class="h2">';
$('#drawer').innerHTML='<div class="brand">МИЛКИ<i></i><small>ШКОЛА</small></div><div class="ava">'+AVA+'</div><div class="dname" id="dname"></div>'+
  `<div class="coins"><span><span class="coin"></span>227</span><span class="bell">${ic('bell')}<span class="bd2">1</span></span></div>`+
  MENU.map(g=>`<div class="dv"></div><div class="sl">${g[0]}</div>`+g[1].map(m=>`<button class="mi"${m[2]?` style="color:${m[2]}"`:''}><span style="position:relative;display:block">${ic(m[0])}${m[3]?`<span class="bd2${m[3]==='cy'?' cy':''}" style="right:-7px;bottom:-7px">1</span>`:''}</span>${m[1]}</button>`).join('')).join('');
$('#chat').innerHTML=ic('talk');

/* ---------- боковое меню: открывается по наведению или клику на всю панель ---------- */
const rail=$('#rail'),drawer=$('#drawer');
const canHover=window.matchMedia('(hover:hover)').matches;
const openMenu=()=>document.body.classList.add('menu');
const closeMenu=()=>document.body.classList.remove('menu');
rail.addEventListener('click',openMenu);                 // клик в любое место панели
if(canHover){
  rail.addEventListener('mousemove',e=>{if(e.movementX||e.movementY)openMenu()});          // наведение курсора
  drawer.addEventListener('mouseleave',closeMenu);       // увели курсор — закрылось
}
$('#shade').addEventListener('click',closeMenu);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});

/* ---------- данные ---------- */
const DAYS=['Пн','Вт','Ср','Чт','Сб'];                    // пятница — неучебный день
const FULL=['Понедельник','Вторник','Среда','Четверг','Суббота'];
const CAP=25,TEACHER='Имя учителя';
// id, название, родительный падеж, часов в неделю, эмодзи, картинка, тема недели
const S=[
 ['alg','Алгебра','Алгебры',3,'➗','formulogia.jpg','Линейные уравнения'],
 ['geom','Геометрия','Геометрии',2,'📐','','Треугольники'],
 ['rus','Русский язык','Русского языка',3,'✍️','russian.jpeg','Причастный оборот'],
 ['lit','Литература','Литературы',1,'📖','literaturnoechtenie.jpg','Басни Крылова'],
 ['phys','Физика','Физики',2,'⚛️','kvantonomika.jpg','Давление'],
 ['bio','Биология','Биологии',2,'🧬','ecoznanie2.jpg','Строение клетки'],
 ['geog','География','Географии',2,'🌍','kartalogia.jpg','Климат России'],
 ['hist','История','Истории',2,'🏛️','proshlovedenie.jpg','Древний Рим'],
 ['eng','Английский язык','Английского языка',2,'🗣️','angliskiyazik.jpg','Past Simple'],
 ['inf','Информатика','Информатики',2,'💻','programmirovanie.jpg','Алгоритмы']
].map((a,i)=>({id:a[0],n:a[1],g:a[2],q:a[3],e:a[4],img:a[5],top:a[6],i,k:a[0]==='eng'?'Академия':'Урок'}));
const SUB=Object.fromEntries(S.map(s=>[s.id,s]));
const TOTAL=S.reduce((a,s)=>a+s.q,0);
const hash=t=>{let x=7;for(const ch of t)x=(x*31+ch.charCodeAt(0))>>>0;return x};
const pad=n=>String(n).padStart(2,'0');
const SL={};
S.forEach(s=>DAYS.forEach((_,d)=>{
  let h=s.id==='eng'?16:8+((3*s.i+d*(s.i%3+1))%8);
  if(s.id==='geom'&&h===SL['alg-'+d].h)h=8+((h-7)%8); // у одного учителя уроки не совпадают
  const id=s.id+'-'+d;
  SL[id]={id,s:s.id,d,h,base:2+hash(id+'s')%21}; // сколько уже записалось (2–22 из 25)
}));

/* ---------- состояние ---------- */
const chosen=new Set();
let view='home',mode='student',approved=false,sel='alg',onYes=null;
const cnt=sid=>[...chosen].filter(id=>SL[id].s===sid).length;
const taken=sl=>sl.base+(chosen.has(sl.id)?1:0);
const mine=d=>[...chosen].map(id=>SL[id]).filter(x=>x.d===d).sort((a,b)=>a.h-b.h);
function why(sl){
  if(cnt(sl.s)>=SUB[sl.s].q)return'лимит';
  for(const id of chosen){const o=SL[id];if(o.d===sl.d&&o.h===sl.h)return'занято'}
  return null;
}

/* ---------- карточки ---------- */
function banner(s,cls){
  return s.img?`<div class="${cls}" style="background-image:url('${s.img}')">`:`<div class="${cls}">${cls==='ban'?`<b>${s.n}</b>`:''}🍩`;
}
function card(sl,btn,info){
  const s=SUB[sl.s];
  return `<article class="lc">${banner(s,'ban')}<span class="tg">${s.k}</span></div><h3>${s.n}</h3><div class="tm">${ic('clock')}${pad(sl.h)}:00 - ${pad(sl.h)}:45</div>${info?`<div class="info">${info}</div>`:''}${btn}</article>`;
}
function weekHTML(teacher){
  return DAYS.map((dn,d)=>{
    const l=teacher?['alg','geom'].map(id=>SL[id+'-'+d]).sort((a,b)=>a.h-b.h):mine(d);
    const w=l.length===1?'урок':l.length>1&&l.length<5?'урока':'уроков';
    return `<div class="dc"><div class="dh"><b>${FULL[d]}</b><span class="bd">${l.length} ${w}</span></div>`+
      (l.length?l.map(x=>`<div class="ls"><div class="tp"><b>${pad(x.h)}:00</b><small>${pad(x.h)}:45</small></div><div><strong>${SUB[x.s].n}</strong><span class="t">${SUB[x.s].k}</span><small>${teacher?'7 класс · '+taken(x)+' из '+CAP:TEACHER}</small></div></div>`).join(''):'<div class="fr">Свободный день 🌿</div>')+'</div>';
  }).join('');
}

/* ---------- отрисовка ---------- */
function rHome(){
  const t=mode==='teacher';
  $('#hello').textContent='Мир тебе, '+(t?'Имя учителя':'Милколенок')+'!';
  $('#dname').textContent=t?'Имя учителя':'Милколенок';
  $('#sw').textContent=t?'Переключить на режим Ученика':'Переключить на режим Учителя';
  $('#stu').hidden=t;$('#tea').hidden=!t;
  $('#sched').hidden=!(t||approved);
  const box=$('#today');
  if(t){
    const ls=['alg','geom'].map(id=>SL[id+'-0']).sort((a,b)=>a.h-b.h);
    box.innerHTML=ls.map((x,i)=>card(x,i?'<button class="soon">Скоро начнется</button>':'<button class="join">Присоединиться</button>','7 класс · записалось '+taken(x)+' из '+CAP)).join('');
    $('#topics').innerHTML=['alg','geom'].map(id=>`<div class="it"><div class="ico">${SUB[id].e}</div><div><b>${SUB[id].n}</b><small>Тема недели для всех 7-х классов: <strong>${SUB[id].top}</strong></small></div></div>`).join('');
    $('#week').innerHTML=weekHTML(true);
  }else if(!approved){
    box.innerHTML=`<div class="rest"><span>Расписание ещё не составлено</span><button class="start" id="start">Начать ${ic('arrow')}</button></div>`;
  }else{
    box.innerHTML=mine(0).map((x,i)=>card(x,i?'<button class="soon">Скоро начнется</button>':'<button class="join">Присоединиться</button>')).join('')||'<div class="rest">В понедельник уроков нет — свободный день 🌿</div>';
    $('#week').innerHTML=weekHTML(false);
  }
}
function rPick(){
  const n=chosen.size,s=SUB[sel];
  $('#subs').innerHTML=S.map(x=>`<button class="sc${x.id===sel?' on':''}" data-s="${x.id}">${banner(x,'sb')}</div><b>${x.n}</b><small>${cnt(x.id)}/${x.q} ч</small></button>`).join('');
  $('#tleft').textContent='Сколько часов осталось: '+(TOTAL-n)+' из '+TOTAL;
  $('#tfill').style.width=(n/TOTAL*100)+'%';
  $('#sh').textContent=s.n+' — когда проходят уроки на неделе';
  $('#days').innerHTML=DAYS.map((dn,d)=>{
    const sl=SL[s.id+'-'+d],on=chosen.has(sl.id),r=on?null:why(sl),lf=CAP-taken(sl);
    return `<div class="dd"><b>${FULL[d]}</b><div class="tmx">${pad(sl.h)}:00 – ${pad(sl.h)}:45</div><small class="${lf<=3?'low':''}">Осталось мест: ${lf} из ${CAP}</small><button class="pick-b${on?' on':''}" data-id="${sl.id}"${r?' disabled':''}>${on?'Выбрано ✓':r||'Выбрать'}</button></div>`;
  }).join('');
  const c=cnt(s.id);
  $('#sleft').textContent='Сколько часов '+s.g+' осталось: '+(s.q-c)+' из '+s.q;
  $('#sfill').style.width=(c/s.q*100)+'%';
  $('#ready').innerHTML=weekHTML(false);
  $('#done').disabled=!n;
}
function show(v){
  view=v;
  $('#v-home').hidden=v!=='home';$('#v-pick').hidden=v!=='pick';$('#v-review').hidden=v!=='review';$('#v-hw').hidden=v!=='hw';$('#v-sim').hidden=v!=='sim';
  $('#done').hidden=v!=='pick';$('#approve').hidden=v!=='review';$('#chat').hidden=!(v==='home'||v==='hw');
  if(v==='home')rHome();
  if(v==='pick')rPick();
  if(v==='review')$('#rv').innerHTML=weekHTML(false);
  window.scrollTo(0,0);
}
function ask(text,fn){$('#mtext').textContent=text;onYes=fn;$('#mod').hidden=false}

/* ---------- действия ---------- */
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('#start'))show('pick');
  else if(t.closest('#sw')){mode=mode==='student'?'teacher':'student';rHome()}
  else if(t.closest('#done')&&!$('#done').disabled)ask('После утверждения расписания его нельзя будет изменить в течение 1 месяца.',()=>show('review'));
  else if(t.closest('#back'))show('pick');
  else if(t.closest('#approve'))ask('После нажатия «Да» Вы не сможете редактировать расписание с 1 октября по 31 октября.',()=>{approved=true;show('home')});
  else if(t.closest('#yes')){$('#mod').hidden=true;if(onYes)onYes();onYes=null}
  else if(t.closest('#no')){$('#mod').hidden=true;onYes=null}
  else if(t.closest('.sc')){sel=t.closest('.sc').dataset.s;rPick()}
  else if(t.closest('.pick-b')){
    const b=t.closest('.pick-b');if(b.disabled)return;
    const id=b.dataset.id;
    if(chosen.has(id))chosen.delete(id);else if(!why(SL[id]))chosen.add(id);
    rPick();
  }
});

/* ---------- чек-лист, домашка, оценки ---------- */
const CL=[['Настроила камеру и микрофон','Проверь, что всё работает заранее'],['Проснулась вовремя','Отметь, если день начался без спешки'],['Сделала зарядку / разминку','Короткая активность перед уроками'],['Позавтракала / выпила воды','Подготовка к концентрации на занятиях'],['Проверила, сданы ли все домашние задания','Убедись, что ничего не забыто'],['Подготовила рабочее место','Стол, свет, тишина, наушники'],['Открыла расписание уроков на сегодня','Проверь время и последовательность занятий'],['Заранее зашла на первый урок','Лучше за 2–3 минуты до начала']];
const done=new Set();
function rCl(){
  $('#cl').innerHTML=CL.map((c,i)=>`<div class="it"><div class="ico">${ic('tick')}</div><div><b>${c[0]}</b><small>${c[1]}</small></div><button class="go${done.has(i)?' ok':''}" data-i="${i}">${done.has(i)?'Готово ✓':'Отметить'}</button></div>`).join('');
  $('#cl-n').textContent=done.size+'/'+CL.length;
  $('#cl-bar').style.width=(done.size/CL.length*100)+'%';
}
$('#cl').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(!b)return;const i=+b.dataset.i;done.has(i)?done.delete(i):done.add(i);rCl()});
const HW=[['phys','Физика','','15 Октября 20:00'],['bio','Биология','','13 Октября 20:00'],['alg','Алгебра','','15 Октября 20:00'],['geom','Геометрия','','14 Октября 20:00'],['inf','Информатика','','13 Октября 20:00'],['rus','Русский язык','Базовый вариант','12 Октября 20:00'],['geog','География','','12 Октября 20:00'],['lit','Литература','','13 Октября 17:00']];
function rHw(){
  $('#hw').innerHTML=HW.map(w=>{const s=HWM.st(w[0]);const bt=s==='graded'?'<button class="go ok" data-hw="'+w[0]+'">Оценка 5 ✓</button>':s==='review'?'<button class="go" data-hw="'+w[0]+'" style="background:#eef1f4;color:#6b7580">На проверке</button>':'<button class="go" data-hw="'+w[0]+'">Открыть ›</button>';
    return `<div class="it"><div class="ico">${ic('note')}</div><div><b>${w[1]}${w[2]?`<span class="tag2">${w[2]}</span>`:''}</b><small>Сдать до <strong>${w[3]}</strong></small></div>${bt}</div>`}).join('');
}
$('#hw').addEventListener('click',e=>{const b=e.target.closest('[data-hw]');if(b)HWM.open(b.dataset.hw)});
const GR=[['Домашнее задание','Русский язык',5,'11 Октября'],['Домашнее задание','География',4,'10 Октября'],['Домашнее задание','Физика',5,'10 Октября'],['Оценка на уроке','Биология',5,'10 Октября']];
function rGr(){
  $('#gr').innerHTML=[...HWM.grades(),...GR].map(g=>`<div class="gc"><div class="gt"><div><small>${g[0]}</small><b>${g[1]}</b></div><div class="mark${g[2]===4?' m4':''}">${g[2]}</div></div><div class="gd"><div><small>Дата</small><b>${g[3]}</b></div><span>${ic('note')}</span></div></div>`).join('');
}
window.MS={show,ic,SUB,HW};
HWM.onchange=()=>{rHw();rGr()};

/* ---------- старт ---------- */
rCl();rHw();rGr();show('home');
})();
</script>
</body>
</html>
