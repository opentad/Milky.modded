<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Высадка — Остров Эхо</title>
<style>
:root{--ink:#10171c;--lamp:#ffb44a;--paper:#f2ecdc;--teal:#8fd3c4}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:var(--paper);font-family:Georgia,'Times New Roman',serif;overflow:hidden}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#fade{position:fixed;inset:0;background:#05080a;opacity:0;pointer-events:none;z-index:5}

/* верхняя полоска: вещи и звук */
#hud{position:fixed;left:10px;right:10px;top:calc(10px + env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:flex-start;gap:8px;pointer-events:none;z-index:10}
.chip{font:inherit;font-size:15px;padding:6px 12px;background:rgba(16,23,28,.72);color:var(--paper);border:1px solid #34454c;border-radius:14px}
#inv{display:none;color:var(--teal)}
#snd{pointer-events:auto;cursor:pointer;margin-left:auto}

/* джойстик и «присесть» */
#pad{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));display:none;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:8}
#joy{position:relative;width:112px;height:112px;border-radius:50%;background:rgba(16,23,28,.45);border:2px solid rgba(255,180,74,.7);touch-action:none;pointer-events:auto}
#knob{position:absolute;left:50%;top:50%;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:var(--lamp);opacity:.85;pointer-events:none}
#crch{pointer-events:auto;padding:12px 14px;font-size:16px;opacity:.92}
#crch.on{background:var(--teal)}

/* блок снизу посередине: диалоги, мысли, подсказки */
#box{display:none;position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));width:min(680px,calc(100vw - 24px));max-height:42vh;overflow:auto;z-index:10;
 padding:12px 18px 14px;background:rgba(16,23,28,.9);border:2px solid #34454c;border-radius:22px;box-shadow:0 6px 22px rgba(0,0,0,.45)}
body.beach #box{width:min(680px,calc(100vw - 300px))}
@media (max-width:760px){body.beach #box{width:min(680px,calc(100vw - 24px));bottom:calc(138px + env(safe-area-inset-bottom))}}
#tag{font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px;color:var(--lamp)}
#tag:empty{display:none}
#txt{font-size:18px;line-height:1.5}
#acts{display:flex;flex-direction:column;gap:8px;padding-top:10px}
#acts:empty{display:none}
/* диалог */
#box.dlg{border-color:var(--lamp)}
#box.dlg[data-w^="Амир"]{border-color:var(--teal)}
#box.dlg[data-w^="Амир"] #tag{color:var(--teal)}
/* мысли и описание */
#box.think{background:rgba(26,24,48,.84);border:2px dotted #8a86a8;border-radius:30px}
#box.think #txt{font-style:italic;color:#d9d3c0}
#box.think.echo{border-color:#b9a7ff}
#box.think.echo #txt{color:#b9a7ff}
/* голос игры: подсказки и правила */
#box.game{background:rgba(10,24,28,.93);border-color:var(--teal)}
#box.game #tag{color:var(--teal)}
#box.game #txt{font-size:16px;white-space:pre-line}
#box.game ol{margin-left:20px}
#box.game li{margin:5px 0}
/* дневник */
#box.diary{background:var(--paper);color:var(--ink);border:3px solid #0a1216;border-radius:14px;box-shadow:4px 4px 0 var(--lamp)}
#box.diary #tag{color:#5a4a2a}
#box.diary #txt{font-size:16px;line-height:1.45}
#box.diary ul{margin-left:18px}
#box.diary li{margin:4px 0}
/* конец уровня: по центру */
#box.end{bottom:50%;transform:translate(-50%,50%)}

.btn{font:inherit;font-size:17px;padding:13px 16px;background:var(--lamp);color:var(--ink);border:2px solid #0a1216;border-radius:10px;box-shadow:0 3px 0 #0a1216;cursor:pointer}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #0a1216}
.btn:disabled{opacity:.4}
#noise{font:20px/1.3 ui-monospace,Menlo,monospace;letter-spacing:2px;color:var(--teal);min-height:28px;text-align:center}
input[type=range]{width:100%;height:36px;accent-color:var(--lamp)}
small{color:#9fb0b5}
@media (prefers-reduced-motion:reduce){.btn{transition:none}}
</style></head>
<body>
<canvas id="cv"></canvas>
<div id="fade"></div>
<div id="hud"><div class="chip" id="inv"></div><button class="chip" id="snd">Звук: вкл</button></div>
<div id="pad"><div id="joy"><div id="knob"></div></div><button class="btn" id="crch">Присесть</button></div>
<div id="box"><div id="tag"></div><div id="txt"></div><div id="acts"></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s),box=$('#box'),tag=$('#tag'),txt=$('#txt'),acts=$('#acts'),cv=$('#cv'),inv=$('#inv'),pad=$('#pad'),fadeEl=$('#fade');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
let skip=false;box.addEventListener('click',()=>skip=true);

/* ---------- ЗВУК (WebAudio, всё рисуется кодом) ---------- */
const A={ctx:null,on:true};
function audioInit(){
 if(A.ctx){if(A.ctx.state!=='running')A.ctx.resume();return}
 const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
 const x=A.ctx=new AC();
 A.master=x.createGain();A.master.gain.value=A.on?.8:0;
 A.lp=x.createBiquadFilter();A.lp.type='lowpass';A.lp.frequency.value=18000;
 A.master.connect(A.lp);A.lp.connect(x.destination);
 const n=x.sampleRate*3;A.white=x.createBuffer(1,n,x.sampleRate);A.brown=x.createBuffer(1,n,x.sampleRate);
 const w=A.white.getChannelData(0),b=A.brown.getChannelData(0);let l=0;
 for(let i=0;i<n;i++){const r=Math.random()*2-1;w[i]=r;l=(l+.02*r)/1.02;b[i]=l*3.5}
 A.sea=layer(A.brown,'lowpass',700,.5);A.surf=layer(A.white,'bandpass',1600,.5);A.wind=layer(A.white,'bandpass',500,.8);A.rain=layer(A.white,'highpass',3000,.7);
 lfo(A.sea.g.gain,.1,.07);lfo(A.surf.g.gain,.085,.03);
 A.tCreak=2;A.tGull=6;A.pf=0}
addEventListener('pointerdown',audioInit);addEventListener('keydown',audioInit);
function layer(buf,type,f,q){const x=A.ctx,s=x.createBufferSource();s.buffer=buf;s.loop=true;const fl=x.createBiquadFilter();fl.type=type;fl.frequency.value=f;fl.Q.value=q||.7;const g=x.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(A.master);s.start();return{s,fl,g}}
function lfo(param,f,depth){const x=A.ctx,o=x.createOscillator(),g=x.createGain();o.frequency.value=f;g.gain.value=depth;o.connect(g);g.connect(param);o.start()}
function beep(f,d,t,v,w,f2){const x=A.ctx;if(!x||!A.on)return;const t0=x.currentTime+(w||0),o=x.createOscillator(),g=x.createGain();o.type=t||'sine';o.frequency.setValueAtTime(f,t0);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t0+d);g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(A.master);o.start(t0);o.stop(t0+d+.05)}
function burst(d,type,f,q,v,w,f2){const x=A.ctx;if(!x||!A.on)return;const t0=x.currentTime+(w||0),s=x.createBufferSource();s.buffer=A.white;const fl=x.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t0);if(f2)fl.frequency.exponentialRampToValueAtTime(f2,t0+d);fl.Q.value=q;const g=x.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+Math.min(.02,d/3));g.gain.exponentialRampToValueAtTime(.0001,t0+d);s.connect(fl);fl.connect(g);g.connect(A.master);s.start(t0,Math.random()*2);s.stop(t0+d+.05)}
function creak(v){const x=A.ctx;if(!x||!A.on)return;const t0=x.currentTime,d=.5+Math.random()*.6,o=x.createOscillator(),f=x.createBiquadFilter(),g=x.createGain();o.type='sawtooth';o.frequency.setValueAtTime(70+Math.random()*30,t0);o.frequency.linearRampToValueAtTime(100+Math.random()*60,t0+d);f.type='bandpass';f.frequency.value=500+Math.random()*300;f.Q.value=6;g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.08);g.gain.linearRampToValueAtTime(0,t0+d);o.connect(f);f.connect(g);g.connect(A.master);o.start(t0);o.stop(t0+d+.05)}
function thunder(v){const w=.15+Math.random()*.5;burst(.12,'highpass',2500,.7,v*.6,0);burst(2.4,'lowpass',500,.6,v,w,70);burst(1.2,'lowpass',250,.6,v*.7,w+.4,50)}
function gull(){beep(1700,.28,'triangle',.035,0,1100);beep(1500,.3,'triangle',.03,.32,900)}
function step(h){if(h<.45){burst(.16,'bandpass',800+rnd(0,300),.9,.1);burst(.08,'highpass',3000,.5,.03)}else{burst(.1,'bandpass',1500+rnd(0,700),.9,.07);burst(.14,'lowpass',260,.6,.05)}}
function chime(){beep(660,.25,'sine',.12);beep(990,.35,'sine',.1,.09);beep(1320,.4,'sine',.06,.18)}
function click(){beep(900,.05,'square',.04)}
function scribble(){for(let i=0;i<4;i++)burst(.07,'bandpass',3200,1.5,.05,i*.09)}
function radioCrackle(){burst(.18,'bandpass',2600,1.6,.07);beep(1200,.05,'square',.02,.16)}
function crash(){creak(.18);burst(.8,'lowpass',900,.7,.3,0,80)}
function endSnd(){beep(110,3.5,'sine',.16);beep(165,3.5,'sine',.08,.15);beep(220,3.5,'sine',.04,.3)}
/* голос «Эй!» и его эхо (чем дальше, тем глуше) */
function shout(v,p,lowp,w){const x=A.ctx;if(!x||!A.on)return;const t0=x.currentTime+(w||0),d=.45,o=x.createOscillator(),g=x.createGain(),lp=x.createBiquadFilter();
 o.type='sawtooth';o.frequency.setValueAtTime(p,t0);o.frequency.linearRampToValueAtTime(p*1.25,t0+.2);o.frequency.linearRampToValueAtTime(p*1.1,t0+d);
 g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(v,t0+.04);g.gain.linearRampToValueAtTime(0,t0+d);
 lp.type='lowpass';lp.frequency.value=lowp;lp.connect(A.master);
 [[550,5],[2000,5]].forEach(([f,q])=>{const b=x.createBiquadFilter();b.type='bandpass';b.frequency.value=f;b.Q.value=q;g.connect(b);b.connect(lp)});
 o.connect(g);o.start(t0);o.stop(t0+d+.05)}
/* шум и голос рации при настройке */
function radioStart(){const x=A.ctx;if(!x||!A.on)return;const st=layer(A.white,'bandpass',2200,.6),o=x.createOscillator(),o2=x.createOscillator(),f=x.createBiquadFilter(),g=x.createGain();
 o.type=o2.type='sawtooth';o.frequency.value=165;o2.frequency.value=168;f.type='bandpass';f.frequency.value=900;f.Q.value=1.2;g.gain.value=0;
 o.connect(f);o2.connect(f);f.connect(g);g.connect(A.master);o.start();o2.start();A.rad={st,o,o2,g};radioCrackle()}
function radioSet(q){if(!A.rad)return;const T=A.ctx.currentTime;A.rad.st.g.gain.setTargetAtTime(.22*(1-q)+.02,T,.05);A.rad.st.fl.frequency.value=1200+Math.random()*3000;A.rad.g.gain.setTargetAtTime(.1*q*q,T,.05)}
function radioStop(){const r=A.rad;if(!r)return;A.rad=null;const T=A.ctx.currentTime;r.st.g.gain.setTargetAtTime(0,T,.08);r.g.gain.setTargetAtTime(0,T,.08);setTimeout(()=>{try{r.st.s.stop();r.o.stop();r.o2.stop()}catch(e){}},700);beep(1000,.08,'sine',.08)}
/* писк при печати текста: у каждого свой голос */
function blip(kind,who){if(!A.ctx||!A.on)return;
 if(kind==='dlg'){if(who.startsWith('Север'))beep(140+rnd(-10,14),.07,'triangle',.06);else beep(250+rnd(-25,25),.05,'square',.022)}
 else if(kind==='think')beep(520+rnd(-40,40),.05,'sine',.03);
 else beep(900,.03,'square',.012)}
/* фоновый звук каждый кадр: море, ветер, дождь, скрип, чайки, гром */
function audUpd(dt){const x=A.ctx;if(!x)return;const T=x.currentTime,k=S.storm,isB=cur==='beach';
 A.sea.g.gain.setTargetAtTime(isB?.2:.13+.18*k,T,.3);
 A.surf.g.gain.setTargetAtTime(isB?.05:.02+.06*k,T,.3);
 A.wind.g.gain.setTargetAtTime(.015+.3*k+(isB?.02:0),T,.3);A.wind.fl.frequency.setTargetAtTime(350+700*k+120*Math.sin(S.t*.6),T,.3);
 A.rain.g.gain.setTargetAtTime(rain.visible&&!isB?.2*k:0,T,.3);
 A.lp.frequency.setTargetAtTime(400*Math.pow(45,1-S.fade),T,.1);
 A.tCreak-=dt;if(A.tCreak<0){A.tCreak=rnd(2.5,6)/(1+2*k);if(!isB&&S.sink<.1)creak(.04+.1*k)}
 A.tGull-=dt;if(A.tGull<0){A.tGull=rnd(9,18);if(k<.2&&!S.over)gull()}
 if(S.flash>A.pf+.3)thunder(Math.min(.6,S.flash*.5));A.pf=S.flash}
$('#snd').addEventListener('click',()=>{A.on=!A.on;if(A.master)A.master.gain.setTargetAtTime(A.on?.8:0,A.ctx.currentTime,.05);$('#snd').textContent='Звук: '+(A.on?'вкл':'выкл')});

/* ---------- блок снизу: диалоги, мысли, подсказки ---------- */
/* show: kind = dlg (кто-то говорит) | think (мысли, описание) | game (подсказки и правила) */
async function show(kind,who,text,o={}){
 box.className=kind+(o.cls?' '+o.cls:'');box.dataset.w=who||'';box.style.display='block';
 tag.textContent=kind==='dlg'?who:(kind==='game'?(o.tag||'Подсказка'):'');
 txt.textContent='';acts.innerHTML='';skip=false;
 if(kind==='dlg'&&who.startsWith('Амир'))radioCrackle();
 let i=0;for(const ch of text){txt.textContent+=ch;if(ch!==' '&&(i++%2===0))blip(kind,who);if(!skip)await sleep(20)}
 skip=false;
 if(o.nowait){await sleep(300);return}
 const w=Math.min(6500,Math.max(1800,1300+45*text.length)),t0=performance.now();
 while(!skip&&performance.now()-t0<w)await sleep(50);
 skip=false}
const say=(who,text,o)=>show('dlg',who,text,o);
const think=(text,cls,o)=>show('think','',text,Object.assign({cls:cls||''},o||{}));
const hint=(text,o)=>show('game','',text,o);
function choose(labels){return new Promise(res=>{box.style.display='block';acts.innerHTML='';labels.forEach((l,i)=>{const b=document.createElement('button');b.className='btn';b.textContent=l;b.onclick=()=>{click();acts.innerHTML='';res(i)};acts.append(b)})})}
/* правила даёт игра, а не персонаж */
async function rules(){
 box.className='game';box.dataset.w='';box.style.display='block';tag.textContent='Правила экспедиции';
 txt.innerHTML='<ol><li>Каждая находка — улика. Всё важное попадёт в дневник.</li><li>Выводы ты делаешь сам и держишь их в голове. Ошибаться можно — это часть дела.</li><li>Задания можно проходить в любом порядке. Каждое — отдельная находка.</li></ol>';
 acts.innerHTML='';chime();await choose(['Принято'])}

/* ---------- 3D (Three.js) ---------- */
if(typeof THREE==='undefined'){document.body.innerHTML='<p style="padding:28px;font:19px/1.5 Georgia;color:#f2ecdc">Не загрузилась библиотека Three.js. Проверь интернет и обнови страницу.</p>';throw new Error('no three')}
const S={scene:'deck',t:0,storm:0,stormT:0,sink:0,sinkT:0,fade:0,fadeT:0,flash:0,echo:-9,active:false,hint:false,seen:{},stand:0,px:0,pz:12,cr:0,dist:0,inv:[],over:false};
let R;for(const o of [{antialias:true},{antialias:false},{antialias:false,powerPreference:'low-power'}]){try{R=new THREE.WebGLRenderer({canvas:cv,...o});break}catch(e){}}
if(!R){document.body.innerHTML='<p style="padding:28px;font:19px/1.5 Georgia;color:#f2ecdc">Не удалось включить 3D (WebGL). Открой файл в обычном браузере (Chrome) или на сайте, а не во встроенном просмотре приложения.</p>';throw new Error('no webgl')}
R.setPixelRatio(Math.min(devicePixelRatio||1,2));
const sc=new THREE.Scene(),cam=new THREE.PerspectiveCamera(72,1,.1,1000);cam.rotation.order='YXZ';sc.add(cam);
function fit(){const w=cv.clientWidth,h=cv.clientHeight;if(!w||!h)return;R.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
new ResizeObserver(fit).observe(cv);
const cc=h=>new THREE.Color(h);
const sm=(a,b,x)=>{const t=Math.max(0,Math.min(1,(x-a)/(b-a)));return t*t*(3-2*t)};

/* текстуры (рисуются кодом) */
function tex(w,h,draw,rep){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;if(rep)t.repeat.set(rep[0],rep[1]);t.anisotropy=4;return t}
const woodTex=(base,rep)=>tex(256,256,(x,w,h)=>{x.fillStyle=base;x.fillRect(0,0,w,h);for(let i=0;i<8;i++){const y=i*32;x.fillStyle='rgba(0,0,0,.4)';x.fillRect(0,y,w,2);for(let k=0;k<40;k++){x.fillStyle=`rgba(${Math.random()<.5?'0,0,0':'255,230,190'},${rnd(.03,.1)})`;x.fillRect(rnd(0,w),y+rnd(2,30),rnd(20,100),1)}}},rep);
const sandTex=tex(256,256,(x,w,h)=>{x.fillStyle='#d6bf8a';x.fillRect(0,0,w,h);for(let i=0;i<3500;i++){x.fillStyle=`rgba(${Math.random()<.5?'120,95,50':'255,245,210'},${rnd(.05,.22)})`;x.fillRect(rnd(0,w),rnd(0,h),rnd(1,3),rnd(1,3))}},[125,65]);

/* небо, свет, туман */
const skyU={top:{value:cc('#000')},bot:{value:cc('#000')}};
sc.add(new THREE.Mesh(new THREE.SphereGeometry(800,24,16),new THREE.ShaderMaterial({uniforms:skyU,side:THREE.BackSide,depthWrite:false,fog:false,vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',fragmentShader:'uniform vec3 top;uniform vec3 bot;varying float h;void main(){gl_FragColor=vec4(mix(bot,top,clamp(h*1.6,0.,1.)),1.);}'})));
const amb=new THREE.HemisphereLight(0xcfe8ff,0x3a3020,.9),sun=new THREE.DirectionalLight(0xffd9a8,1.4);sun.position.set(40,35,50);sc.add(amb,sun);
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(16,16,12),new THREE.MeshBasicMaterial({color:0xffe2a8,fog:false}));sunDisc.position.set(-175,42,-675);sc.add(sunDisc);
sc.fog=new THREE.Fog(0xe7b98b,30,300);
const PD={top:cc('#5f9bb5'),bot:cc('#f2b27a')},PB={top:cc('#41606c'),bot:cc('#a5b8b0')},PS={top:cc('#0a1216'),bot:cc('#2a3a41')},WH=cc('#ffffff');

/* море */
const seaG=new THREE.PlaneGeometry(700,700,100,100);seaG.rotateX(-Math.PI/2);
const seaM=new THREE.MeshPhongMaterial({color:0x1d6a78,shininess:90,specular:0x99bbcc,flatShading:true});
const sea=new THREE.Mesh(seaG,seaM);sc.add(sea);const sp=seaG.attributes.position;
const wh=(x,z)=>(.25+1.0*S.storm)*(Math.sin(x*.12+S.t*1.1)+.6*Math.sin(z*.17+S.t*1.4)+.4*Math.sin((x+z)*.3+S.t*2.1));
function seaUpd(){for(let i=0;i<sp.count;i++)sp.setY(i,wh(sp.getX(i),sp.getZ(i)));sp.needsUpdate=true}

/* корабль */
const ship=new THREE.Group();sc.add(ship);
const wood=new THREE.MeshStandardMaterial({map:woodTex('#7a4b2a'),roughness:.85}),dark=new THREE.MeshStandardMaterial({map:woodTex('#4a3120'),roughness:.9}),
 deckT=woodTex('#b58a55',[.4,.4]),cloth=new THREE.MeshStandardMaterial({color:0xe9e2cd,roughness:1,side:THREE.DoubleSide}),rope=new THREE.MeshStandardMaterial({color:0xc2a878,roughness:1});
deckT.center.set(.5,.5);deckT.rotation=Math.PI/2;const deckM=new THREE.MeshStandardMaterial({map:deckT,roughness:.9});
const hs=new THREE.Shape();hs.moveTo(-2.4,7);hs.lineTo(-2.6,0);hs.bezierCurveTo(-2.6,-4,-1.3,-7.5,0,-9.5);hs.bezierCurveTo(1.3,-7.5,2.6,-4,2.6,0);hs.lineTo(2.4,7);hs.closePath();
ship.add(new THREE.Mesh(new THREE.ExtrudeGeometry(hs,{depth:2.2,bevelEnabled:false,curveSegments:16}).rotateX(Math.PI/2),wood));
const dk=new THREE.Mesh(new THREE.ExtrudeGeometry(hs,{depth:.05,bevelEnabled:false,curveSegments:16}).rotateX(Math.PI/2),deckM);dk.position.y=.07;ship.add(dk);

  await hint('Подойди к вещам на берегу и коснись их.\nХодить: джойстик слева внизу или W A S D.\nПрисесть: кнопка справа или C. Взять: тап по вещи или E.',{nowait:true});
  S.hint=true;S.active=true;
  await new Promise(res=>{S.onSpot=async i=>{if(S.busy)return;S.busy=true;S.seen[i]=1;
    if(ITEMS[i]&&!S.inv.includes(ITEMS[i])){S.inv.push(ITEMS[i]);invUpd();chime()}
    await think(INFO[i],'',{nowait:true});S.busy=false;if(i===2){S.onSpot=null;res()}}});
  S.active=false;S.hint=false;
  await sleep(1200);
  await think('Ты включаешь рацию. Шипение. Нужно поймать канал 63.');
  await tune();
  await say('Амир (рация)','…Ковчег-7… кто на связи? Это Амир. Я жив, меня выбросило на северный берег.');
  await say('Амир (рация)','Остальные не отвечают. Продолжаю звать.');
  await say('Север','Слышу вас. Я на другом берегу. Сиди на месте и не уходи вглубь острова. Я найду тебя.');
  await think('Тишина. Ты решаешь проверить, слышит ли тебя хоть что-то на берегу.');
  await choose(['Крикнуть: «Эй!»']);
  shout(.28,190,9000,0);
  await sleep(1800);S.echo=S.t;
  shout(.2,190,5000,0);shout(.12,190,3200,1.1);shout(.07,188,2300,2.4);shout(.05,150,1500,3.8);
  await think('Эй… эй… эй…','echo');
  await think('Ты молчишь. Эхо — нет.','echo');
  await diary()}
function tune(){return new Promise(res=>{
  acts.innerHTML='<div id="noise"></div><input type="range" min="0" max="100" value="12" id="sl"><small>Крути ручку, пока шум не сложится в голос</small>';
  radioStart();
  const nz=$('#noise'),sl=$('#sl'),sig='Ковчег-7, ответьте…';let ok=0;
  const iv=setInterval(()=>{const d=Math.abs(sl.value-63),q=Math.max(0,1-d/35);let s='';
    for(let i=0;i<sig.length;i++)s+=Math.random()<q?sig[i]:'░▒▓#%/~'[Math.random()*7|0];
    nz.textContent=s;radioSet(q);ok=d<=2?ok+1:0;if(ok>10){clearInterval(iv);radioStop();acts.innerHTML='';res()}},100)})}
/* конец уровня: дневник сам записывает находки, без вопросов */
async function diary(){
  box.className='diary';box.dataset.w='';box.style.display='block';tag.textContent='Дневник экспедиции · День 1: Высадка';txt.innerHTML='';acts.innerHTML='';
  const ul=document.createElement('ul');txt.append(ul);
  for(const t of ['Шторма не было в прогнозе (так сказал Амир на палубе).','Рация нашлась на берегу. Канал экспедиции — 63.','Амир жив. Север на другом берегу и обещал найти меня.','Эхо вернулось и после того, как я замолчал.']){
    const li=document.createElement('li');li.textContent=t;ul.append(li);scribble();await sleep(1500)}
  await sleep(1800);await end()}
async function end(){
  window.vysadkaDone=true;dispatchEvent(new Event('vysadka:done'));
  S.over=true;pad.style.display='none';document.body.classList.remove('beach');
  S.fadeT=1;endSnd();await sleep(2200);
  await show('game','','Уровень пройден. Дневник сохранён.\nОстальные находки этой недели ждут тебя в других заданиях.',{tag:'Высадка · конец уровня',cls:'end',nowait:true});
  await choose(['Пройти заново']);location.reload()}
fit();requestAnimationFrame(frame);deck();
