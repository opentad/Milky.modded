<title>3D-песочница</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#f6f7f3;color:#1d2a24;font:14px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
body{display:flex;flex-direction:column}
button{width:40px;height:40px;padding:0;color:#1d2a24;background:#fff;border:1px solid #dde3dc;border-radius:10px}
button svg{width:24px;height:24px;display:block;margin:auto;transition:transform .2s}
button.pri{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
button.on{background:#e7f4ec;border-color:#2f8f5b;color:#1f6e43}
button.tx{width:auto;min-width:36px;padding:0 9px;font:700 12px system-ui,sans-serif}
#more.open svg{transform:rotate(180deg)}
.rw{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sp{flex:1}
#top{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:5px;background:#fff;border-bottom:1px solid #dde3dc}
#mn{flex:1;min-height:0;display:flex;flex-direction:column}
#cw{flex:1;min-height:0;position:relative}
#c{display:block;width:100%;height:100%;touch-action:none}
#st{position:absolute;left:8px;bottom:6px;font-size:13px;color:#1d2a24;background:#ffffffcc;border-radius:8px;padding:2px 8px;pointer-events:none}
#st:empty{display:none}
#pn{background:#fff;border-top:1px solid #dde3dc;padding:6px;overflow-y:auto;max-height:46vh}
#dr{display:none}
.ctx{display:none}.ctx.v{display:block}
.ctx.off{opacity:.35;pointer-events:none}
#sw{display:contents}
#sw button{width:30px;height:30px;border-radius:50%}
#col{width:40px;height:34px;padding:0;border:1px solid #dde3dc;border-radius:8px;background:#fff}
.sr{display:grid;grid-template-columns:18px 1fr 48px;align-items:center;gap:6px}
.sr input,.sr2 input[type=range]{width:100%;height:30px;accent-color:#2f8f5b}
.sr span{font-size:12px;color:#66736c;text-align:right}
.sr2{display:flex;align-items:center;gap:6px;margin-bottom:4px}
.sr2 button{flex:none}
.dt svg{display:block;color:#66736c}.dt.s svg{width:12px}.dt.m svg{width:22px}.dt.l svg{width:26px}
input[type=text]{flex:1;min-width:0;height:36px;padding:0 8px;border:1px solid #dde3dc;border-radius:8px;background:#fff;color:#1d2a24;font:14px system-ui,sans-serif;user-select:text;-webkit-user-select:text}
input[type=text]:read-only{background:#f2f5f1;color:#66736c}
#tb button{flex:1;height:34px}
.hint{font-size:12px;color:#66736c;margin:0 0 6px}
.lb{font-size:12px;color:#66736c;min-width:46px}
.lg{display:flex;flex-wrap:wrap;gap:5px;max-height:128px;overflow-y:auto;margin-bottom:6px}
.lg button{height:36px}
#pl{max-height:118px;overflow-y:auto}
.pr{display:flex;gap:5px;margin-bottom:4px}
.pr .op{flex:1;min-width:0;height:36px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pr .dl{width:36px;height:36px}
.dl.arm{background:#fde8e6;border-color:#d33;color:#d33}
@media (orientation:landscape){#mn{flex-direction:row}#pn{width:300px;max-height:none;border-top:0;border-left:1px solid #dde3dc}}
</style>
</head>

const flat=a=>{const n=a.count,s=a.itemSize,o=new Float32Array(n*s);for(let i=0;i<n;i++)for(let c=0;c<s;c++)o[i*s+c]=a["get"+"XYZW"[c]](i);return new THREE.BufferAttribute(o,s)};
async function loadGLB(src,label,fit){
 say("Загружаю: "+label+"…");
 let M;try{M=await import("three/addons/loaders/GLTFLoader.js")}catch(e){return say("Нужен интернет для загрузки")}
 let gl;
 try{gl=await new Promise((ok,no)=>{const ld=new M.GLTFLoader();if(typeof src==="string")ld.load(src,ok,undefined,no);else ld.parse(src,"",ok,no)})}
 catch(e){return say("Не получилось открыть модель (ссылка или формат)")}
 gl.scene.updateMatrixWorld(true);
 const ms=[];gl.scene.traverse(o=>{if(o.isMesh&&!o.isSkinnedMesh&&o.geometry&&o.geometry.attributes.position)ms.push(o)});
 if(!ms.length)return say("В модели нет фигур");
 if(ms.length>60)return say("Слишком много частей: "+ms.length);
 let tris=0;ms.forEach(o=>{const g=o.geometry;tris+=(g.index?g.index.count:g.attributes.position.count)/3});
 if(tris>MAXT/2)return say("Модель слишком тяжёлая: "+Math.round(tris)+" граней");
 const bx=new THREE.Box3().setFromObject(gl.scene),sz=bx.getSize(new THREE.Vector3()),c=bx.getCenter(new THREE.Vector3()),sc=(fit||3)/(Math.max(sz.x,sz.y,sz.z)||1);
 const px=Math.round(ct.target.x),pz=Math.round(ct.target.z),gid=rid(),list=[];
 ms.forEach(o=>{
  const s=o.geometry,n=s.attributes.position.count,g=new THREE.BufferGeometry();
  g.setAttribute("position",flat(s.attributes.position));
  g.setAttribute("uv",s.attributes.uv?flat(s.attributes.uv):new THREE.BufferAttribute(new Float32Array(n*2),2));
  g.setIndex(new THREE.Uint32BufferAttribute(s.index?Array.from(s.index.array):Array.from({length:n},(_,i)=>i),1));
  g.applyMatrix4(o.matrixWorld);g.translate(-c.x,-bx.min.y,-c.z);g.scale(sc,sc,sc);
  const mt=Array.isArray(o.material)?o.material[0]:o.material,mp=mt&&mt.map&&mt.map.image;
  if(mp&&s.attributes.uv){const uv=g.attributes.uv;for(let i=0;i<n;i++)uv.setY(i,1-uv.getY(i))}
  const m=make({t:"csg",b:mt&&mt.color?"#"+mt.color.getHexString():"#cccccc",p:[px,0,pz],s:[1,1,1],r:[0,0,0],m:0,mt:[mt&&mt.metalness!=null?mt.metalness:0,mt&&mt.roughness!=null?mt.roughness:.85,mt&&mt.opacity!=null?mt.opacity:1]},g);
  if(mp){try{m.userData.x.drawImage(mp,0,0,S,S);MK(m)}catch(e){}}
  m.userData.gid=gid;list.push(m);
 });
 if(list.length===1)list[0].userData.gid=0;
 setSel(list);commit();say("Модель добавлена");
}

const PT="sandbox_projects",LS="sb3d_projects";
const sbOn=()=>!!(SB_URL&&SB_KEY);
const hd=x=>Object.assign({apikey:SB_KEY,Authorization:"Bearer "+SB_KEY,"Content-Type":"application/json"},x);
async function sbq(path,opt){const rs=await fetch(SB_URL+"/rest/v1/"+PT+path,opt);if(!rs.ok)throw new Error("сервер "+rs.status);const t=await rs.text();return t?JSON.parse(t):null}
const lsAll=()=>{try{return JSON.parse(localStorage.getItem(LS)||"{}")}catch(e){return{}}};
const eq=encodeURIComponent;
const ST={
 async list(n){
  if(sbOn())return sbq("?select=id,name,kind,updated_at&order=updated_at.desc&nick=eq."+eq(n),{headers:hd()});
  return (lsAll()[n]||[]).map(p=>({id:p.id,name:p.name,kind:p.kind,updated_at:p.updated_at})).sort((a,b)=>b.updated_at.localeCompare(a.updated_at));
 },
 async get(n,id){
  if(sbOn()){const rs=await sbq("?select=data&id=eq."+id+"&nick=eq."+eq(n),{headers:hd()});return rs&&rs[0]?rs[0].data:null}
  const p=(lsAll()[n]||[]).find(x=>x.id===id);return p?p.data:null;
 },
 async put(n,id,name,kd,data){
  const now=new Date().toISOString();
  if(sbOn()){
   if(id){const rs=await sbq("?id=eq."+id+"&nick=eq."+eq(n),{method:"PATCH",headers:hd({Prefer:"return=representation"}),body:JSON.stringify({name,kind:kd,data,updated_at:now})});if(rs&&rs.length)return id}
   const rs=await sbq("",{method:"POST",headers:hd({Prefer:"return=representation"}),body:JSON.stringify({nick:n,name,kind:kd,data})});return rs[0].id;
  }
  const all=lsAll(),l=all[n]||(all[n]=[]);let p=id?l.find(x=>x.id===id):null;
  if(p)Object.assign(p,{name,kind:kd,data,updated_at:now});else{id=Date.now();l.push({id,name,kind:kd,data,updated_at:now})}
  localStorage.setItem(LS,JSON.stringify(all));return id;
 },
 async del(n,id){
  if(sbOn()){await sbq("?id=eq."+id+"&nick=eq."+eq(n),{method:"DELETE",headers:hd()});return}
  const all=lsAll();all[n]=(all[n]||[]).filter(x=>x.id!==id);localStorage.setItem(LS,JSON.stringify(all));
 }
};
async function refList(){
 const pl=$("pl"),n=nickv;
 if(!n){pl.innerHTML='<div class="hint">Впиши ник — появятся твои проекты</div>';return}
 let l;try{l=await ST.list(n)}catch(e){pl.innerHTML='<div class="hint">Не удалось получить список. Проверь связь</div>';return}
 pl.innerHTML="";
 if(!l||!l.length){pl.innerHTML='<div class="hint">Пока нет проектов. Нажми «Сохранить»</div>';return}
 l.forEach(p=>{
  const row=document.createElement("div");row.className="pr";
  const o=document.createElement("button");o.className="tx op"+(p.id===cur.id?" on":"");
  const dt=new Date(p.updated_at).toLocaleDateString("ru-RU",{day:"numeric",month:"short"});
  o.textContent=(p.kind==="loc"?"Локация: ":"Предмет: ")+p.name+" ("+dt+")";
  o.onclick=()=>openProj(p);
  const d=document.createElement("button");d.className="dl";d.innerHTML=ic("trash");
  d.onclick=async()=>{
   if(!d.classList.contains("arm")){d.classList.add("arm");say("Нажми ещё раз, чтобы удалить");setTimeout(()=>d.classList.remove("arm"),2500);return}
   try{await ST.del(n,p.id);if(cur.id===p.id)cur.id=null;say("Удалено");refList()}catch(e){say("Не удалось удалить")}
  };
  row.appendChild(o);row.appendChild(d);pl.appendChild(row);
 });
}

}
