body{display:flex;flex-direction:column}

button small{font-size:10px;line-height:1;font-weight:600;white-space:nowrap}
button:disabled{opacity:.4}
button.pri{background:#2f8f5b;border-color:#2f8f5b;color:#fff}
button.on{background:#e7f4ec;border-color:#2f8f5b;color:#1f6e43}
button.pri.on{background:#2f8f5b;color:#fff}
button.tx{height:34px;min-width:44px;padding:0 9px;flex-direction:row;font:700 12px system-ui,sans-serif}
#more.open svg{transform:rotate(180deg)}
.rw{display:flex;gap:5px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.sp{flex:1}
em{font-style:normal;font-size:12px;color:#66736c;white-space:nowrap}
.hd{font-size:12px;font-weight:700;color:#1f6e43;margin:2px 0 4px}
.nt{font-size:11px;color:#66736c;line-height:1.3;margin:0 0 4px}
#top{display:flex;gap:5px;flex-wrap:wrap;align-items:center;padding:5px;background:#fff;border-bottom:1px solid #dde3dc}
#mn{flex:1;min-height:0;display:flex;flex-direction:column}
#cw{flex:1;min-height:0;position:relative}
#c{display:block;width:100%;height:100%;touch-action:none}
#st{position:absolute;left:8px;bottom:6px;font-size:13px;color:#1d2a24;background:#ffffffcc;border-radius:8px;padding:2px 8px;pointer-events:none}
#st:empty{display:none}
#pn{background:#fff;border-top:1px solid #dde3dc;padding:6px;overflow-y:auto}
#dr{display:none}
.ctx{display:none}.ctx.v{display:block}
.ctx.off{opacity:.35;pointer-events:none}
#sw{display:flex;flex-wrap:wrap;gap:4px}
#sw button{width:28px;min-width:28px;height:28px;padding:0;border-radius:50%}
#wh{width:112px;height:112px;flex:none;touch-action:none}
.cc{flex:1;min-width:150px}
#cp{height:26px;border-radius:8px;border:1px solid #dde3dc;margin:4px 0 6px}
.sr{display:grid;grid-template-columns:18px 1fr 48px;align-items:center;gap:6px}
.sr input{width:100%;height:30px;accent-color:#2f8f5b}
.sr span{font-size:12px;color:#66736c;text-align:right}
.sr2{display:flex;align-items:center;gap:6px;margin-bottom:5px;flex-wrap:wrap}
.sr2 button{flex:none}
.sr2 em{min-width:56px}
.sr2 input{flex:1;min-width:90px;width:auto;height:30px;accent-color:#2f8f5b}
#tu{display:none;background:#e7f4ec;border:1px solid #2f8f5b;border-radius:10px;padding:6px 8px;margin-bottom:6px}
#tu.v{display:block}
#tn{font-weight:700;font-size:13px;color:#1f6e43}
#tt{font-size:13px;line-height:1.35;margin:3px 0 6px}
#tu .rw{margin:0}
.hint{outline:3px solid #e8923a;outline-offset:1px;animation:pl 1s infinite}
@keyframes pl{50%{outline-color:transparent}}
@media (orientation:landscape){#mn{flex-direction:row}#pn{width:300px;border-top:0;border-left:1px solid #dde3dc}}
</style>

  if(d>R){im.data[i+3]=0;continue}
  const q=hsv((Math.atan2(dy,dx)*180/Math.PI+360)%360,Math.min(1,d/R),cvv);
  im.data[i]=q[0]*255;im.data[i+1]=q[1]*255;im.data[i+2]=q[2]*255;im.data[i+3]=255;
 }
 wx.clearRect(0,0,WS,WS);wx.putImageData(im,0,0);
 const a=ch*Math.PI/180,mx=c+Math.cos(a)*cs*R,my=c+Math.sin(a)*cs*R;
 wx.beginPath();wx.arc(mx,my,6,0,7);wx.lineWidth=3;wx.strokeStyle="#fff";wx.stroke();wx.lineWidth=1;wx.strokeStyle="#000";wx.stroke();
}
function applyCol(){col=hx(hsv(ch,cs,cvv));$("cp").style.background=col;drawWheel()}
function setCol(hex){
 const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255,mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
 let h=0;if(d){h=mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;h*=60;if(h<0)h+=360}
 ch=h;cs=mx?d/mx:0;cvv=mx;$("cb").value=Math.round(cvv*100);applyCol();
}

function gx(a,k,v){
 const cur=val(k),c=new THREE.Vector3();ss.forEach(m=>c.add(m.position));c.multiplyScalar(1/ss.length);
 if(tool==="p"){const d=v-cur;ss.forEach(m=>m.position[a]+=d)}
 else if(tool==="s"){const f=cur>.001?v/cur:1;ss.forEach(m=>{m.position[a]=c[a]+(m.position[a]-c[a])*f;m.scale[a]*=f})}
 else{const q=new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(+(k===0),+(k===1),+(k===2)),(v-cur)*Math.PI/180);ss.forEach(m=>{m.position.sub(c).applyQuaternion(q).add(c);m.quaternion.premultiply(q)})}

}

function dlf(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();say("Файл "+name+" скачан")}
function strip(){
 const rs=[];
 group.children.forEach(m=>{const g=m.geometry,s={m,a:{},vc:m.material.vertexColors};["color","l0","l1","l2"].forEach(n=>{if(g.attributes[n]){s.a[n]=g.attributes[n];g.deleteAttribute(n)}});m.material.vertexColors=false;m.material.needsUpdate=true;rs.push(s)});
 return rs;
}
function unstrip(rs){rs.slice().reverse().forEach(s=>{const g=s.m.geometry;for(const n in s.a)g.setAttribute(n,s.a[n]);s.m.material.vertexColors=s.vc;s.m.material.needsUpdate=true})}
function exp(kind){
 if(!group.children.length)return say("Сначала добавь фигуру");
 const sv=ss.slice();clearFace();select(null);ruler.visible=false;
 const rs=strip(),back=()=>{unstrip(rs);setSel(sv)};
 try{
  if(kind==="obj")dlf(new Blob([new OBJExporter().parse(group)],{type:"text/plain"}),"model.obj");
  else if(kind==="stl")dlf(new Blob([new STLExporter().parse(group,{binary:true})],{type:"model/stl"}),"model.stl");
  else{
   new GLTFExporter().parse(group,res=>{dlf(new Blob([res],{type:"model/gltf-binary"}),"model.glb");back()},()=>{say("Ошибка экспорта");back()},{binary:true});
   return;
  }
 }catch(e){say("Ошибка экспорта")}
 back();
}

function paint(h,er){
 const u=own(h.object).userData,x=u.x,px=h.uv.x*S,py=(1-h.uv.y)*S;
 x.fillStyle=x.strokeStyle=er?u.b:col;x.lineWidth=bs;x.lineCap="round";
 if(last&&Math.hypot(px-last.x,py-last.y)<S*.1){x.beginPath();x.moveTo(last.x,last.y);x.lineTo(px,py);x.stroke()}
 else{x.beginPath();x.arc(px,py,bs/2,0,7);x.fill()}
 last={x:px,y:py};u.tx.needsUpdate=true;
}
function fill(h){
 const u=own(h.object).userData,x=u.x;x.fillStyle=col;
 if(u.t==="cube"){const cx=Math.min(2,Math.floor(h.uv.x*3)),cy=Math.min(1,Math.floor(h.uv.y*2));x.fillRect(cx*S/3,(1-(cy+1)/2)*S,S/3+1,S/2+1)}
 else{x.fillRect(0,0,S,S);u.b=col}
 u.tx.needsUpdate=true;
}
const cur=new THREE.Mesh(new THREE.RingGeometry(.9,1,48),new THREE.MeshBasicMaterial({color:0xe8923a,side:THREE.DoubleSide,depthTest:false,transparent:true}));
cur.visible=false;cur.renderOrder=20;scene.add(cur);
function ring(h){const n=h.face.normal.clone().transformDirection(h.object.matrixWorld);cur.position.copy(h.point);cur.lookAt(h.point.clone().add(n));cur.scale.setScalar(rad);cur.visible=true}
const lsc=o=>(Math.abs(o.scale.x)+Math.abs(o.scale.y)+Math.abs(o.scale.z))/3||1;
function topo(o){
 const g=o.geometry,pa=g.attributes.position,u=o.userData;
 if(u.tp&&u.tp.g===g&&u.tp.n===pa.count)return u.tp;
 const ix=g.index.array,wid=weld(pa),nw=wid.n,off=new Int32Array(nw+1);
 for(let i=0;i<pa.count;i++)off[wid[i]+1]++;
 for(let w=0;w<nw;w++)off[w+1]+=off[w];
 const fl=off.slice(0,nw),lst=new Int32Array(pa.count);
 for(let i=0;i<pa.count;i++)lst[fl[wid[i]]++]=i;
 const nb=Array.from({length:nw},()=>new Set());
 for(let t=0;t<ix.length;t+=3)for(let e=0;e<3;e++){const a=wid[ix[t+e]],b=wid[ix[t+(e+1)%3]];if(a!==b){nb[a].add(b);nb[b].add(a)}}
 return u.tp={g,n:pa.count,wid,nw,off,lst,nb:nb.map(q=>Int32Array.from(q))};
}
function sculpt(h){
 const o=own(h.object),u=o.userData;
 if(al>=0&&u.lk[al]<.05)return say("Подними силу слоя");
 const R=rad/lsc(o),R2=R*R,p=h.object.worldToLocal(h.point.clone()),n0=h.face.normal.clone();
 if(dyn)splitLong(o,p,R*1.15,Math.max(.03/lsc(o),R*.4));
 const g=o.geometry,pa=g.attributes.position,mk=g.attributes.color;
 if(!g.attributes.normal)nrm(o);
 const na=g.attributes.normal,T=topo(o),wid=T.wid,nw=T.nw,off=T.off,lst=T.lst,nb=T.nb;
 if(al>=0&&!g.attributes["l"+al])g.setAttribute("l"+al,new THREE.BufferAttribute(new Float32Array(pa.count*3),3));
 const ly=al>=0?g.attributes["l"+al]:null,lk=al>=0?u.lk[al]:1;
 const wt=new Float32Array(nw),dm=new Float32Array(nw).fill(-2),sn=new Uint8Array(nw),ids=[];
 for(let i=0;i<pa.count;i++){
  const dx=pa.getX(i)-p.x,dy=pa.getY(i)-p.y,dz=pa.getZ(i)-p.z,d2=dx*dx+dy*dy+dz*dz;
  if(d2>=R2)continue;
  const w=wid[i],dt=na.getX(i)*n0.x+na.getY(i)*n0.y+na.getZ(i)*n0.z;
  if(!sn[w]){sn[w]=1;const f=1-Math.sqrt(d2)/R;let s=f*f*(3-2*f);if(mk)s*=1-(1-mk.getX(i))/.65;wt[w]=s;ids.push(w)}
  if(dt>dm[w])dm[w]=dt;
 }
 if(!ids.length)return;
 ids.forEach(w=>{wt[w]*=Math.max(0,Math.min(1,(dm[w]-.1)/.4))});
 let np=null;
 if(sb==="m"){
  np=new Float32Array(ids.length*3);
  ids.forEach((w,j)=>{
   const r0=lst[off[w]],x=pa.getX(r0),y=pa.getY(r0),z=pa.getZ(r0),L=nb[w],s=wt[w];
   if(!s||!L.length){np[3*j]=x;np[3*j+1]=y;np[3*j+2]=z;return}
   let ax=0,ay=0,az=0;for(const q of L){const r=lst[off[q]];ax+=pa.getX(r);ay+=pa.getY(r);az+=pa.getZ(r)}
   const a=Math.min(1,s*.7*str);
   np[3*j]=x+(ax/L.length-x)*a;np[3*j+1]=y+(ay/L.length-y)*a;np[3*j+2]=z+(az/L.length-z)*a;
  });
 }
 const dir=sb==="u"?1:-1;
 ids.forEach((w,j)=>{
  const s=wt[w];if(!s)return;
  for(let k=off[w];k<off[w+1];k++){
   const i=lst[k],x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i);let nx,ny,nz;
   if(np){nx=np[3*j];ny=np[3*j+1];nz=np[3*j+2]}
   else{const m=dir*.1*R*str*s;nx=x+n0.x*m;ny=y+n0.y*m;nz=z+n0.z*m}
   pa.setXYZ(i,nx,ny,nz);
   if(ly)ly.setXYZ(i,ly.getX(i)+(nx-x)/lk,ly.getY(i)+(ny-y)/lk,ly.getZ(i)+(nz-z)/lk);
  }
 });
 pa.needsUpdate=true;if(ly)ly.needsUpdate=true;nrm(o);u.sc=true;
}
function maskPaint(h){
 const o=own(h.object),g=o.geometry,pa=g.attributes.position,p=h.object.worldToLocal(h.point.clone()),R=rad/lsc(o);
 let c=g.attributes.color;
 if(!c){c=new THREE.BufferAttribute(new Float32Array(pa.count*3).fill(1),3);g.setAttribute("color",c);o.material.vertexColors=true;o.material.needsUpdate=true}
 for(let i=0;i<pa.count;i++){
  const d=Math.hypot(pa.getX(i)-p.x,pa.getY(i)-p.y,pa.getZ(i)-p.z);
  if(d<R){const w=Math.min(1,(1-d/R)*1.6);let m=(1-c.getX(i))/.65;m=mkm==="a"?Math.max(m,w):Math.max(0,m-w);const v=1-.65*m;c.setXYZ(i,v,v,v)}
 }
 c.needsUpdate=true;
}

function ray(e){
 const b=cv.getBoundingClientRect(),rc=new THREE.Raycaster();
 rc.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-((e.clientY-b.top)/b.height)*2+1),cam);
 return rc.intersectObjects(group.children,false)[0];
}
function act(h){if(tool==="b")paint(h,false);else if(tool==="e")paint(h,true);else if(tool==="u")sculpt(h);else if(tool==="k")maskPaint(h);if(tool==="u"||tool==="k")ring(h)}
cv.addEventListener("pointerdown",e=>{
 if(!e.isPrimary)return;
 const h=ray(e);dn={x:e.clientX,y:e.clientY,t:Date.now(),h};
 if(h&&"beuk".includes(tool)){drag=true;ct.enabled=false;cv.setPointerCapture(e.pointerId);const o=own(h.object);if(!ss.includes(o))select(o);act(h)}
},{capture:true});
cv.addEventListener("pointermove",e=>{if(!drag||!e.isPrimary)return;const h=ray(e);if(h)act(h);else last=null});
function up(e){
 if(!e.isPrimary)return;
 ct.enabled=true;
 if(drag){drag=false;last=null;dn=null;cur.visible=false;commit();return}
 if(!dn)return;
 const tap=Math.hypot(e.clientX-dn.x,e.clientY-dn.y)<8&&Date.now()-dn.t<500,h=dn.h;dn=null;
 if(!tap)return;
 if(tool==="f"){if(h){fill(h);commit()}}
 else if(mm){if(h)toggle(own(h.object))}
 else{select(h?own(h.object):null);if("ghv".includes(tool)&&h)selectFace(h,tool==="h"?"e":tool)}
}
cv.addEventListener("pointerup",up,{capture:true});
cv.addEventListener("pointercancel",up,{capture:true});
