<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Лаборатория чисел</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#070b18;--cy:#5ee0ff;--am:#ffb84d;--gr:#58ff9a;--rd:#ff6b7d;--glass:rgba(12,18,42,.78)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:'Onest',system-ui,sans-serif;color:#eaf1ff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12)}
h1,h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(135deg,var(--cy),#7aa8ff);color:#06122b;font-weight:700;font-size:16px;padding:14px 22px;border-radius:14px;width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}

#hud{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}
#name{font-family:'Unbounded',sans-serif;font-weight:500;font-size:14px;padding:8px 14px;border-radius:999px}
#dots{display:flex;gap:5px;padding:10px 12px;border-radius:999px}
#dots i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:.4s}
#dots i.on{background:var(--am);width:26px}
#dots i.done{background:var(--cy)}
#meter{position:fixed;top:62px;left:14px;right:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;z-index:3;transition:opacity .4s}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--gr));border-radius:3px;transition:width .2s}
#readout{position:fixed;top:78px;left:50%;transform:translateX(-50%);padding:8px 16px;border-radius:16px;font-weight:600;font-size:14px;line-height:1.3;text-align:center;max-width:calc(100vw - 28px);z-index:3;transition:opacity .3s}
#hint{position:fixed;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.4;z-index:3;transition:opacity .4s}
.hide{opacity:0!important;pointer-events:none!important}

#card{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto;border-radius:24px;padding:20px 20px 18px;z-index:5;transform:translateY(130%);transition:transform .7s cubic-bezier(.2,.9,.2,1);max-height:68vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#card.show{transform:none}
#ctag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--cy);padding:5px 12px 5px 10px;border-radius:999px;background:rgba(94,224,255,.12)}
#ctag:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy)}
#ctitle{font-size:20px;line-height:1.2;margin:12px 0 8px}
#ctext{font-size:15.5px;line-height:1.55;color:#d6e1ff;max-width:60ch}
#cfact{margin:14px 0 16px;padding:10px 14px;border-left:3px solid var(--am);background:rgba(255,184,77,.09);border-radius:0 12px 12px 0;font-size:14px;line-height:1.5;color:#ffe3b3}

.screen{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:6;transition:opacity .6s}
.panel{width:100%;max-width:520px;border-radius:26px;padding:26px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#menu h1{font-size:30px;line-height:1.05;margin-bottom:6px;background:linear-gradient(120deg,#fff,var(--cy) 60%,var(--am));-webkit-background-clip:text;background-clip:text;color:transparent}
#menu .sub{color:var(--am);font-weight:600;font-size:14px;margin-bottom:14px}
#menu p{font-size:15.5px;line-height:1.55;color:#d6e1ff;margin-bottom:10px}
#menu ul{list-style:none;margin:12px 0 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#menu li{font-size:13.5px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.07)}
#quiz{align-items:center;background:rgba(5,8,20,.55)}
#qtop{font-size:13.5px;color:var(--am);font-weight:600;margin-bottom:10px}
#qtext{font-size:18px;line-height:1.4;font-weight:600;margin-bottom:16px}
#qbtns{display:grid;gap:9px}
.qb{background:rgba(255,255,255,.09);color:#eaf1ff;font-size:16px;font-weight:600;padding:14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);text-align:left}
.qb.ok{background:rgba(88,255,154,.18);border-color:var(--gr)}
.qb.bad{background:rgba(255,107,125,.18);border-color:var(--rd)}
#qfb{font-size:14.5px;line-height:1.5;color:#d6e1ff;margin:14px 0;min-height:44px}
#qfb b{color:#fff}
.big{font-family:'Unbounded',sans-serif;font-size:46px;font-weight:700;color:var(--am);margin:6px 0 10px}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="name" class="glass"></div>
  <div id="dots" class="glass"></div>
</div>
<div id="meter" class="hide"><div id="fill"></div></div>
<div id="readout" class="glass hide"></div>
<div id="hint" class="glass hide"></div>

<div id="card" class="glass">
  <span id="ctag"></span>
  <h2 id="ctitle"></h2>
  <p id="ctext"></p>
  <div id="cfact"></div>
  <button class="btn" id="cnext">Дальше</button>
</div>

<div id="menu" class="screen">
  <div class="panel glass">
    <h1>Лаборатория чисел</h1>
    <div class="sub">§ 1. Числа и выражения, п. 1</div>
    <p>Рациональные числа можно потрогать: расселяй их по множествам, дели плитку, считай остатки и катай колесо.</p>
    <ul>
      <li>Множества N, Z, Q</li><li>Равные дроби</li><li>Деление и период</li><li>Число между числами</li><li>Колесо π</li><li>Проверка</li>
    </ul>
    <button class="btn" id="start">Начать опыты</button>
  </div>
</div>

<div id="quiz" class="screen hide">
  <div class="panel glass" id="qpanel"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const V3=THREE.Vector3,UP=new V3(0,1,0);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t*t*(3-2*t);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.1},o));
function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}
/* надпись в 3D; .set(текст, цвет) меняет текст на лету */
function dlabel(txt,{color='#fff',w=2.4,fs=56,cw=512,ch=128,dt=false}={}){
  const c=document.createElement('canvas');c.width=cw;c.height=ch;const x=c.getContext('2d'),tex=new THREE.CanvasTexture(c);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthTest:dt}));
  s.scale.set(w,w*ch/cw,1);s.renderOrder=10;
  s.set=(t,col=color)=>{if(s._t===t&&s._c===col)return;s._t=t;s._c=col;x.clearRect(0,0,cw,ch);
    x.font=`700 ${fs}px Onest,system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';
    x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=10;x.fillStyle=col;x.fillText(t,cw/2,ch/2+2);tex.needsUpdate=true};
  s.set(txt);return s}
const fmt=v=>String(parseFloat(v.toFixed(9))).replace('.',',');
const _d=new V3();
function setB(m,A,B){_d.subVectors(B,A);const L=_d.length()||.001;m.position.copy(A).add(B).multiplyScalar(.5);m.scale.set(1,L,1);m.quaternion.setFromUnitVectors(UP,_d.divideScalar(L))}

/* ---------- сцена ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b18);scene.fog=new THREE.Fog(0x070b18,22,60);
const cam=new THREE.PerspectiveCamera(50,1,.1,120);
scene.add(new THREE.HemisphereLight(0x9bb7ff,0x1a1420,.75));
const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(4,10,6);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});scene.add(sun);

const tableTex=(()=>{const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');
  const g=x.createRadialGradient(512,512,0,512,512,512);g.addColorStop(0,'#2a386a');g.addColorStop(1,'#141b38');
  x.fillStyle=g;x.fillRect(0,0,1024,1024);x.strokeStyle='rgba(120,160,255,.15)';x.lineWidth=2;
  for(let i=0;i<=26;i++){const p=i*1024/26;x.beginPath();x.moveTo(p,0);x.lineTo(p,1024);x.moveTo(0,p);x.lineTo(1024,p);x.stroke()}
  return new THREE.CanvasTexture(c)})();
const sideM=mat(0x10162f,{roughness:.6});
const table=new THREE.Mesh(new THREE.CylinderGeometry(6.5,6.7,.4,72),[sideM,new THREE.MeshStandardMaterial({map:tableTex,roughness:.45,metalness:.25}),sideM]);
table.position.y=-.2;table.receiveShadow=true;scene.add(table);
const rim=new THREE.Mesh(new THREE.TorusGeometry(6.52,.045,8,96),new THREE.MeshBasicMaterial({color:0x5ee0ff}));rim.rotation.x=Math.PI/2;scene.add(rim);
{const sp=[];for(let i=0;i<600;i++){const r=rnd(28,50),a=rnd(0,6.283);sp.push(Math.cos(a)*r,rnd(-6,34),Math.sin(a)*r)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9bb7ff,size:.25,fog:false})))}

/* ---------- ввод ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(UP,0),_o=new V3();
function pt(e,h=0){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,cam);plane.constant=-h;return ray.ray.intersectPlane(plane,_o)?_o.clone():null}

/* ---------- состояние ---------- */
let state='menu',cur=null,idx=0,zoomT=0,micro=0,tt=0;
const tPos=new V3(0,9,12),lookC=new V3(0,0,0),tLook=new V3(0,.5,0);

/* ======================= СТАНЦИЯ 1: МНОЖЕСТВА N ⊂ Z ⊂ Q ======================= */
function st1(){
  const g=new THREE.Group(),RAD=[1.5,2.9,4.3],NM=['N','Z','Q'],CP=['натуральные','целые','рациональные'],CO=[0x3fb6dc,0x2d56b3,0x1c2a5c];
  const discs=[],rings=[],zl=[],zc=[];
  for(let i=2;i>=0;i--){
    const geo=new THREE.CylinderGeometry(RAD[i],RAD[i],1,64);geo.translate(0,.5,0);
    const d=new THREE.Mesh(geo,mat(CO[i],{roughness:.55,metalness:.15}));d.castShadow=d.receiveShadow=true;g.add(d);discs[i]=d;
    const r=new THREE.Mesh(new THREE.TorusGeometry(RAD[i],.045,8,96),new THREE.MeshBasicMaterial({color:0x5ee0ff}));r.rotation.x=Math.PI/2;g.add(r);rings[i]=r;
    const a=dlabel(NM[i],{w:1.0,fs:110,dt:true,color:'#eaf1ff'}),b=dlabel(CP[i],{w:2.3,fs:46,dt:true,color:'#cfe3ff'});
    a.position.z=-(RAD[i]-.6);b.position.z=a.position.z+.5;g.add(a,b);zl[i]=a;zc[i]=b}
  const chain=dlabel('N ⊂ Z ⊂ Q',{w:3.6,fs:92,color:'#ffb84d'});chain.position.set(0,2.4,0);g.add(chain);
  const DATA=[['5',0],['−4',1],['1/2',2],['0',1],['−0,7',2],['28',0],['5,6',2],['−27',1]];
  const toks=DATA.map(([s,z],i)=>{
    const a=Math.PI*(.1+.8*i/7),hx=Math.cos(a)*5.45,hz=Math.sin(a)*5.45;
    const t=new THREE.Group(),m=mat(0xffb84d,{roughness:.35});
    t.add(mesh(new THREE.CylinderGeometry(.5,.5,.22,32),m));
    const l=dlabel(s,{w:1.7,fs:84});l.position.y=.5;t.add(l);
    t.position.set(hx,.11,hz);t.home=new V3(hx,.11,hz);t.tgt=t.home.clone();t.right=z;t.zone=-1;t.m=m;t.txt=s;
    g.add(t);return t});
  let drag=null,ok=0,fb='',fbT=0;
  const S={grp:g,name:'Множества',prog:0,
    hint:'Перетащи каждое число в самое маленькое множество, куда оно помещается.',
    home:{pos:new V3(0,9,9),look:new V3(0,0,.5)},
    card:{tag:'Множества чисел',title:'Каждое число живёт в своём кругу',
      text:'Натуральные числа — это 1, 2, 3 …; целые добавляют нуль и противоположные числа; рациональные — ещё и дроби. Поэтому каждый круг лежит внутри следующего: N ⊂ Z ⊂ Q.',
      fact:'Буквы взяты из слов: naturalis — природный, Zahl — число, quotient — отношение.'},
    zoom:()=>({pos:new V3(0,6,11),look:new V3(0,.6,0)}),
    down(e){const P=pt(e,.3);if(!P)return;let b=null,bd=1.1;
      for(const t of toks){if(t.zone>=0)continue;const d=Math.hypot(t.position.x-P.x,t.position.z-P.z);if(d<bd){bd=d;b=t}}
      if(b){drag=b;b.tgt.set(P.x,.9,P.z)}},
    move(e){if(!drag)return;const P=pt(e,.3);if(P)drag.tgt.set(P.x,.9,P.z)},
    up(){if(!drag)return;const t=drag;drag=null;
      const r=Math.hypot(t.tgt.x,t.tgt.z),z=r<RAD[0]?0:r<RAD[1]?1:r<RAD[2]?2:-1;
      if(z===t.right){t.zone=z;t.m.color.setHex(0x58ff9a);fb='';ok++}
      else{
        if(z>t.right)fb=`${t.txt} входит и в ${NM[z]}, но ищи самое маленькое множество`;
        else if(z>=0)fb=`${t.txt} не входит в ${NM[z]}: `+(t.right===1?'натуральные — это 1, 2, 3 …':'это дробь, а в Z только целые');
        else fb='';
        fbT=3.5;t.tgt.copy(t.home)}},
    update(dt){
      const hs=[.14+micro*1,.1+micro*.5,.06],k=1-Math.exp(-dt*14);
      for(let i=0;i<3;i++){discs[i].scale.y=hs[i];rings[i].position.y=hs[i]+.01;zl[i].position.y=hs[i]+.55;zc[i].position.y=hs[i]+.15}
      chain.material.opacity=micro;
      for(const t of toks){
        if(t.zone>=0)t.tgt.y=hs[t.zone]+.11;
        t.position.lerp(t.tgt,k)}
      fbT-=dt;S.prog=ok/8;
      ro(fbT>0&&fb?fb:`Разложено: ${ok} из 8`)}};
  return S}

/* ======================= СТАНЦИЯ 2: РАВНЫЕ ДРОБИ ======================= */
function st2(){
  const g=new THREE.Group(),BL=7,Z0=.3;
  g.add(mesh(new THREE.BoxGeometry(BL+.3,.22,1.5),mat(0x141c3d,{roughness:.6}),0,.11,Z0));
  g.add(mesh(new THREE.BoxGeometry(BL,.1,1.1),mat(0x2b3a78,{roughness:.4}),0,.27,Z0));
  g.add(mesh(new THREE.BoxGeometry(BL/2,.08,1.1),mat(0xffb84d,{roughness:.3,emissive:0xffb84d,emissiveIntensity:.15}),-BL/4,.36,Z0));
  const divM=new THREE.MeshBasicMaterial({color:0x070b18}),divG=new THREE.MeshBasicMaterial({color:0x58ff9a}),divs=[];
  for(let i=0;i<11;i++){const d=new THREE.Mesh(new THREE.BoxGeometry(.07,.22,1.14),divM);d.position.set(0,.36,Z0);d.visible=false;g.add(d);divs.push(d)}
  const post=new THREE.Mesh(new THREE.CylinderGeometry(.03,.03,1,8),new THREE.MeshBasicMaterial({color:0x58ff9a}));post.position.set(0,1,Z0);g.add(post);
  const l0=dlabel('0',{w:.7,cw:128,ch:128,fs:90}),l1=dlabel('1',{w:.7,cw:128,ch:128,fs:90});
  l0.position.set(-BL/2,.3,Z0+1.1);l1.position.set(BL/2,.3,Z0+1.1);g.add(l0,l1);
  const cur_=dlabel('',{w:2.6,fs:96});cur_.position.set(0,1.9,Z0);g.add(cur_);
  const chainL=dlabel('',{w:6.8,cw:1024,fs:60,color:'#ffb84d'});chainL.position.set(0,.5,Z0+2.2);g.add(chainL);
  /* микро: все дроби друг под другом */
  const mi=new THREE.Group();mi.position.set(0,7,0);mi.visible=false;g.add(mi);
  const mlabs=[],OX=.35,BW=2.8;
  const bm=mat(0x2b3a78),am=mat(0xffb84d,{emissive:0xffb84d,emissiveIntensity:.15}),dm=new THREE.MeshBasicMaterial({color:0x070b18}),gm=new THREE.MeshBasicMaterial({color:0x58ff9a});
  for(let r=0;r<6;r++){
    const n=2*(r+1),y=1.75-r*.7;
    mi.add(mesh(new THREE.BoxGeometry(BW,.1,.34),bm,OX,y,0));
    mi.add(mesh(new THREE.BoxGeometry(BW/2,.12,.34),am,OX-BW/4,y,0));
    for(let k=1;k<n;k++){const d=new THREE.Mesh(new THREE.BoxGeometry(.035,.2,.38),k===n/2?gm:dm);d.position.set(OX-BW/2+k*BW/n,y,0);mi.add(d)}
    const lb=dlabel(r===0?'1/2':`${n/2}/${n}`,{w:1.0,cw:256,ch:128,fs:70});lb.position.set(OX-BW/2-.65,y,0);mi.add(lb);mlabs.push(lb)}
  const mline=new THREE.Mesh(new THREE.BoxGeometry(.04,4.3,.04),new THREE.MeshBasicMaterial({color:0x58ff9a}));mline.position.set(OX,0,.25);mi.add(mline);
  const t1=dlabel('это одно и то же число',{w:4.4,cw:1024,fs:54,color:'#ffb84d'});t1.position.set(0,2.9,0);
  const t2=dlabel('1/2 — несократимая дробь:',{w:4.4,cw:1024,fs:50,color:'#58ff9a'});t2.position.set(0,-2.4,0);
  const t3=dlabel('у неё наименьший знаменатель',{w:4.4,cw:1024,fs:50,color:'#58ff9a'});t3.position.set(0,-2.8,0);
  mi.add(t1,t2,t3);mlabs.push(t1,t2,t3);
  let acc=1,lx=0,drag=false,stay=0,lastN=0,cnt=0;const found={};
  const S={grp:g,name:'Дроби',prog:0,
    hint:'Води пальцем влево-вправо: плитка делится на части. Найди 4 дроби, равные 1/2.',
    home:{pos:new V3(0,8,8.5),look:new V3(0,.5,.6)},
    card:{tag:'Рациональные числа',title:'Одно число — много дробей',
      text:'Половина остаётся половиной, сколько бы ни было частей: 1/2 = 2/4 = 3/6 = 4/8 … Любое рациональное число можно записать дробью m/n, где m — целое, а n — натуральное, и притом многими способами.',
      fact:'Из всех таких дробей можно выбрать одну с наименьшим знаменателем — она несократима. Для 1/2 это сама 1/2.'},
    zoom:()=>({pos:new V3(0,7.3,6.2),look:new V3(0,7,0)}),
    down(e){drag=true;lx=e.clientX},up(){drag=false},
    move(e){if(!drag)return;acc=clamp(acc+(e.clientX-lx)/36,1,12);lx=e.clientX},
    update(dt){
      const n=Math.round(acc),even=n%2===0;
      if(n!==lastN){lastN=n;stay=0;
        divs.forEach((d,k)=>{d.visible=k<n-1;if(d.visible){d.position.x=-BL/2+(k+1)*BL/n;d.material=(even&&k===n/2-1)?divG:divM}})}
      if(even){stay+=dt;if(stay>.45&&!found[n]){found[n]=1;cnt++;
        chainL.set(Object.keys(found).map(Number).sort((a,b)=>a-b).map(q=>q===2?'1/2':`${q/2}/${q}`).join(' = '))}}

/* ======================= СТАНЦИЯ 3: ДЕЛЕНИЕ И ПЕРИОД ======================= */
function st3(){

      for(let i=j+1;i<=steps;i++){tiles[i].m.color.setHex(0xffb84d);tiles[i].m.emissive.setHex(0x5a3a00)}
      const x1=XT(j+1)-.5,x2=XT(steps)+.5,cx=(x1+x2)/2;

      ro(fin?res:steps?nowTxt:`Нажми на экран — начнём делить ${n} на ${d}`)}};

 {t:'Как записать число 1/3 в виде бесконечной десятичной дроби?',o:['0,3','0,(03)','0,(3)'],a:2,e:'Делим 1 на 3: остаток каждый раз равен 1, цифра 3 повторяется без конца. Период — 3, запись 0,(3).'},
 {t:'Сравните числа 1,37 и 1,(37).',o:['1,37 < 1,(37)','1,37 = 1,(37)','1,37 > 1,(37)'],a:0,e:'1,(37) = 1,373737 … — после 1,37 идут ещё цифры, поэтому это число чуть больше.'},
 {t:'Какое число больше 1/8, но меньше 1/7?',o:['0,2','0,13','0,1'],a:1,e:'1/8 = 0,125, а 1/7 = 0,142857 … Число 0,13 лежит между ними.'},
 {t:'Чему равно 0,(9) = 0,999 …?',o:['Числу, чуть меньшему 1','Иррациональному числу','Числу 1'],a:2,e:'Дроби с периодом 9 считают другой записью дробей с периодом 0: 0,(9) = 1.'},
 {t:'Какое из чисел иррациональное?',o:['2,5 = 2,5000 …','π = 3,1415926 …','−5/11 = −0,(45)'],a:1,e:'У π нет периода — это бесконечная непериодическая дробь. Остальные числа записываются как m/n, значит, они рациональные.'}];
let qi=0,score=0;
function startQuiz(){cur&&scene.remove(cur.grp);cur=null;state='quiz';idx=ST.length;paintDots();
  $('#name').textContent='Проверка';showHud(false);qi=0;score=0;$('#quiz').classList.remove('hide');renderQ()}
function renderQ(){
  const q=Q[qi],p=$('#qpanel');
  p.innerHTML=`<div id="qtop">Вопрос ${qi+1} из ${Q.length}</div><div id="qtext">${q.t}</div><div id="qbtns">${q.o.map((o,i)=>`<button class="qb" data-i="${i}">${o}</button>`).join('')}</div><div id="qfb"></div><button class="btn" id="qn" disabled>Дальше</button>`;
  p.querySelectorAll('.qb').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;p.querySelectorAll('.qb').forEach(x=>x.disabled=true);
    p.querySelector(`[data-i="${q.a}"]`).classList.add('ok');
    if(i===q.a){score++;$('#qfb').innerHTML='<b>Верно!</b> '+q.e}else{b.classList.add('bad');$('#qfb').innerHTML='<b>Почти.</b> '+q.e}
    const n=$('#qn');n.disabled=false;n.textContent=qi<Q.length-1?'Дальше':'Результат';n.onclick=()=>{qi++;qi<Q.length?renderQ():renderEnd()}})}
function renderEnd(){
  const msg=score>=6?'Ты отлично разобрался в рациональных числах.':score>=4?'Неплохо! Перечитай в параграфе, как устроены периодические дроби.':'Загляни в параграф ещё раз и попробуй снова — опыты помогут.';
  $('#qpanel').innerHTML=`<h2 style="font-size:22px">Задание выполнено</h2><div class="big">${score} из ${Q.length}</div><p style="font-size:15.5px;line-height:1.55;color:#d6e1ff;margin-bottom:12px">${msg}</p><p style="font-size:14px;line-height:1.5;color:#ffe3b3;margin-bottom:18px">Целые и дробные числа вместе — рациональные: N ⊂ Z ⊂ Q. Каждое из них записывается как m/n и как бесконечная периодическая дробь. Непериодические дроби — иррациональные числа; вместе с рациональными они дают действительные.</p><button class="btn" id="again">Пройти заново</button>`;
  $('#again').onclick=()=>{$('#quiz').classList.add('hide');$('#menu').classList.remove('hide');state='menu';load(0)}}

/* ---------- ввод и цикл ---------- */
canvas.addEventListener('pointerdown',e=>{if(state==='play'&&cur&&cur.down){canvas.setPointerCapture(e.pointerId);cur.down(e)}});
canvas.addEventListener('pointermove',e=>{if(state==='play'&&cur&&cur.move)cur.move(e)});
['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,e=>{cur&&cur.up&&cur.up(e)}));
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const fit=()=>clamp(.95/(innerWidth/innerHeight),1,2.3);
load(0);

let prevT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-prevT)/1000);prevT=now;tt+=dt;
  if(cur){
    cur.update(dt);
    if(state==='play'){setProg(cur.prog);if(cur.prog>=1)startZoom()}
    if(state==='zoom'){zoomT+=dt;micro=ease(clamp(zoomT/2.2));if(zoomT>3.2)showCard()}
    if(state==='card')micro=1;
    if(state==='play')micro=0}
  const f=fit();
  if(state==='zoom'||state==='card'){const z=cur.zoom(),zf=1+(f-1)*.55;tPos.copy(z.pos).sub(z.look).multiplyScalar(zf).add(z.look);tLook.copy(z.look)}
  else if(state==='play'&&cur){tPos.copy(cur.home.pos).sub(cur.home.look).multiplyScalar(f).add(cur.home.look);tLook.copy(cur.home.look)}
  else{const a=tt*.12;tPos.set(Math.cos(a)*10*f*.8,6+f,Math.sin(a)*10*f*.8);tLook.set(0,.6,0)}
  const k=1-Math.exp(-dt*2.6);cam.position.lerp(tPos,k);lookC.lerp(tLook,k);cam.lookAt(lookC);
  renderer.render(scene,cam)}
requestAnimationFrame(loop);
</script>
</body>
