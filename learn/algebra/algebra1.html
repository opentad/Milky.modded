<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Числовая дорога</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#1d2b33;--teal:#1aa6b0;--gold:#f0b429;--red:#d6453a;--paper:#f3f0e0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);background:#08141d}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%}
#stage{flex:1 1 0;min-height:180px;position:relative;overflow:hidden;background:#08141d}
canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);display:block;touch-action:none;border-radius:12px;cursor:crosshair}
#side{flex:0 0 auto;max-height:52vh;overflow:auto;background:var(--paper);padding:12px 14px 18px;border-top:4px solid var(--teal)}
@media(min-aspect-ratio:5/4){#app{flex-direction:row}#side{flex:0 0 400px;max-height:none;border-top:0;border-left:4px solid var(--teal)}}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;height:38px;border-radius:10px;background:#dcd8bf;font-weight:800;font-size:14px}
.tab.on{background:var(--teal);color:#fff}
.tab.ok{box-shadow:inset 0 -4px 0 #2fa56b}
.th{padding:12px 14px;border-radius:14px;background:#fff;border-left:8px solid var(--teal);font-size:14px;line-height:1.55;margin-bottom:12px}
.th h3{font-size:17px;color:#0d7a83;margin-bottom:4px}
.th p{margin:5px 0}
.th ul{margin:5px 0 5px 18px}
.th .ex{margin-top:7px;padding:8px 10px;border-radius:10px;background:#e3f4f2}
.task{font-size:16px;font-weight:600;line-height:1.5;margin-bottom:10px}
.fb{min-height:22px;font-size:13.5px;font-weight:600;margin-top:8px;line-height:1.45}
.fb.g{color:#1f7a44}.fb.b{color:#b0471a}
.btn{height:46px;padding:0 20px;border-radius:12px;background:var(--teal);color:#fff;font-weight:700;font-size:14px;box-shadow:0 3px 0 #0e747c;margin:4px 6px 0 0}
.btn.alt{background:var(--red);box-shadow:0 3px 0 #8f2b24}
.mini{height:40px;min-width:62px;padding:0 10px;border-radius:10px;background:#fff;border:2px solid var(--teal);font-weight:700;font-size:13px}
.mini.fk{height:auto;min-height:52px;padding:3px 14px;font-size:14px}
.mini .fr{font-size:1.1em}
.bs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.rd{font-size:15px;margin-bottom:6px}
.rd b{font-size:22px;color:#0d7a83}
input[type=range]{width:100%;height:34px;accent-color:var(--teal)}
input[type=text]{width:100%;height:46px;border:2px solid #b8b08a;border-radius:12px;padding:0 14px;font:inherit;font-size:16px;background:#fffef6;margin-top:8px}
.st{font-size:13.5px;padding:6px 10px;margin-bottom:4px;border-left:4px solid var(--gold);background:#fff;border-radius:0 8px 8px 0;line-height:1.5}
.st.rp{border-color:var(--red);background:#fde3df;font-weight:600}
.win{padding:12px 14px;border-radius:14px;background:#d8f0e1;border:2px solid #2fa56b;font-weight:600;font-size:14px;line-height:1.55}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 3px;font-size:.85em}
.fr i{font-style:normal;border-bottom:2px solid currentColor;padding:0 4px}
.fr b{font-weight:inherit;padding:0 4px;font-size:1em}
.mx{display:inline-flex;align-items:center}
.th .key{margin:8px 0;padding:10px 12px;border-radius:12px;background:#fff3c4;border-left:6px solid var(--gold);font-size:15px;line-height:1.5}
</style>
</head>
<body>
<div id="app"><div id="stage"><canvas id="cv" width="1280" height="720"></canvas></div><aside id="side"></aside></div>
<script>
const $=s=>document.querySelector(s);
const gcd=(a,b)=>b?gcd(b,a%b):Math.abs(a);
const red=(n,d)=>{if(d<0){n=-n;d=-d}const g=gcd(n,d)||1;return{n:n/g,d:d/g}};
const cmp=(a,b)=>a.n*b.d-b.n*a.d;
const fmt=n=>String(Math.round(n*100)/100).replace('.',',').replace('-','−');
const fr=(n,d)=>`<span class="fr"><i>${n}</i><b>${d}</b></span>`;
const mx=(w,n,d)=>`<span class="mx">${w}${fr(n,d)}</span>`;
/* разбор числа: 5, −0,7, 3/4, 1 2/5, 1,(37), 0,8(3) */
function parse(s){
  s=String(s).trim().replace(/[−–—]/g,'-').replace(/\s+/g,' ').replace(/,/g,'.');let m;
  if(m=s.match(/^(-?)(\d+) (\d+)\/(\d+)$/)){const d=+m[4];if(!d)return null;return red((m[1]?-1:1)*(+m[2]*d+ +m[3]),d)}
  if(m=s.match(/^(-?\d+)\/(-?\d+)$/)){if(!+m[2])return null;return red(+m[1],+m[2])}
  if(m=s.match(/^(-?)(\d+)(?:\.(\d*))?(?:\((\d+)\))?$/)){
    const f=m[3]||'',p=m[4]||'';let d=Math.pow(10,f.length),n=+m[2]*d+(+f||0);
    if(p){const k=Math.pow(10,p.length)-1;n=n*k+ +p;d=d*k}
    return red((m[1]?-1:1)*n,d)}
  return null;
}

/* ================= мини-3D движок ================= */
const W=1280,H=720,cv=$('#cv'),x=cv.getContext('2d');
const cam={x:0,y:1.7,z:0,yaw:0,pitch:0},FC=900,FOG=[60,134,146];
const LV=(()=>{const v=[.45,.8,.3],m=Math.hypot(...v);return v.map(a=>a/m)})();
let LST=[];
const P3=p=>{const dx=p[0]-cam.x,dy=p[1]-cam.y,dz=p[2]-cam.z,c=Math.cos(cam.yaw),s=Math.sin(cam.yaw),xr=dx*c-dz*s,zr=dx*s+dz*c,cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch);return[xr,dy*cp+zr*sp,zr*cp-dy*sp]};
const dist=p=>Math.hypot(p[0]-cam.x,p[1]-cam.y,p[2]-cam.z);
const shade=(c,l,d)=>{const f=Math.min(1,Math.pow(Math.max(d,0)/110,1.3))*.95,m=k=>Math.round(c[k]*Math.min(l,1.2)*(1-f)+FOG[k]*f);return`rgb(${m(0)},${m(1)},${m(2)})`};
function addPoly(pts,style,layer,depth,ol){
  const q=pts.map(P3),o=[],N=.3;
  for(let i=0;i<q.length;i++){const a=q[i],b=q[(i+1)%q.length];if(a[2]>=N)o.push(a);if((a[2]>=N)!==(b[2]>=N)){const t=(N-a[2])/(b[2]-a[2]);o.push([a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,N])}}
  if(o.length<3)return;
  LST.push({k:0,path:o.map(p=>[W/2+FC*p[0]/p[2],H/2-FC*p[1]/p[2]]),st:style,l:layer,d:depth,ol});
}
const quad=(x0,x1,z0,z1,col,y=0,l=0)=>{const d=dist([(x0+x1)/2,y,(z0+z1)/2]);addPoly([[x0,y,z0],[x1,y,z0],[x1,y,z1],[x0,y,z1]],shade(col,.8,d),l,d)};
const boxF=(x0,x1,y0,y1,z0,z1,col,o={})=>{const c=[(x0+x1)/2,(y0+y1)/2,(z0+z1)/2],v=[[x0,y0,z0],[x1,y0,z0],[x1,y1,z0],[x0,y1,z0],[x0,y0,z1],[x1,y0,z1],[x1,y1,z1],[x0,y1,z1]];return[[0,1,2,3],[5,4,7,6],[4,0,3,7],[1,5,6,2],[3,2,6,7],[4,5,1,0]].map(i=>({p:i.map(k=>v[k]),col,c,em:o.em,ol:o.ol}))};
function nrm(fc){const p=fc.p,a=p[0],b=p[1],c=p[2],u=[b[0]-a[0],b[1]-a[1],b[2]-a[2]],v=[c[0]-a[0],c[1]-a[1],c[2]-a[2]];let n=[u[1]*v[2]-u[2]*v[1],u[2]*v[0]-u[0]*v[2],u[0]*v[1]-u[1]*v[0]];const m=Math.hypot(...n)||1;n=n.map(k=>k/m);
  const g=p.reduce((s,q)=>[s[0]+q[0],s[1]+q[1],s[2]+q[2]],[0,0,0]).map(k=>k/p.length);if(n[0]*(g[0]-fc.c[0])+n[1]*(g[1]-fc.c[1])+n[2]*(g[2]-fc.c[2])<0)n=n.map(k=>-k);return[n,g]}
function faces(Fs){for(const fc of Fs){const[n,g]=nrm(fc);if(n[0]*(cam.x-g[0])+n[1]*(cam.y-g[1])+n[2]*(cam.z-g[2])<=0)continue;const d=dist(g);
  addPoly(fc.p,fc.em?`rgb(${fc.col.join(',')})`:shade(fc.col,.42+.58*Math.max(0,n[0]*LV[0]+n[1]*LV[1]+n[2]*LV[2]),d),1,d,fc.ol)}}
function lab(txt,wx,wy,wz,size,col='#fff'){const q=P3([wx,wy,wz]);if(q[2]<.6)return;LST.push({k:1,x:W/2+FC*q[0]/q[2],y:H/2-FC*q[1]/q[2],s:size*FC/q[2],txt,col,l:1,d:dist([wx,wy,wz])-.6})}
function drawLabel(t,X,Y,s,col){
  if(s<7)return;x.textAlign='center';x.textBaseline='middle';x.lineJoin='round';x.fillStyle=col;x.strokeStyle='rgba(8,20,30,.85)';x.lineWidth=Math.max(2,s*.12);
  const T=(str,px,py,fs)=>{x.font=`800 ${fs}px Montserrat,sans-serif`;x.strokeText(str,px,py);x.fillText(str,px,py)};
  const fracAt=(n,d,px)=>{T(n,px,Y-s*.4,s*.8);T(d,px,Y+s*.45,s*.8);x.strokeStyle='rgba(8,20,30,.85)';x.lineWidth=s*.2;x.beginPath();x.moveTo(px-s*.4,Y);x.lineTo(px+s*.4,Y);x.stroke();x.strokeStyle=col;x.lineWidth=s*.09;x.beginPath();x.moveTo(px-s*.4,Y);x.lineTo(px+s*.4,Y);x.stroke()};
  if(t.startsWith('f:')){const[,n,d]=t.split(':');fracAt(n,d,X)}
  else if(t.startsWith('m:')){const[,w,n,d]=t.split(':');T(w,X-s*.55,Y,s);fracAt(n,d,X+s*.4)}
  else T(t,X,Y,s)}
function flush(){
  LST.sort((a,b)=>a.l-b.l||b.d-a.d);
  for(const i of LST){
    if(i.k===0){x.fillStyle=i.st;x.beginPath();i.path.forEach((p,j)=>j?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.closePath();x.fill();
      if(i.ol){x.strokeStyle=i.ol;x.lineWidth=2.4;x.lineJoin='round';x.stroke()}else{x.strokeStyle=i.st;x.lineWidth=.8;x.stroke()}}
    else drawLabel(i.txt,i.x,i.y,i.s,i.col)}
  LST=[];
}
function sky(){
  const hy=H/2-FC*Math.tan(cam.pitch),g=x.createLinearGradient(0,0,0,Math.max(hy,2));g.addColorStop(0,'#0b1d2e');g.addColorStop(1,'#46949f');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.fillStyle='rgb(60,134,146)';x.fillRect(0,Math.max(hy,0),W,H);
  x.fillStyle='rgba(30,70,90,.7)';x.beginPath();x.moveTo(0,hy);for(let X=0;X<=W;X+=20)x.lineTo(X,hy-18-14*Math.sin(X*.009+cam.yaw*4)-9*Math.sin(X*.025));x.lineTo(W,hy);x.fill();
}
function env(){
  const cz=cam.z,z0=Math.floor((cz-12)/8)*8;
  for(let z=z0;z<cz+130;z+=8){
    quad(-70,-5,z,z+8,[34,64,60]);quad(5,70,z,z+8,[34,64,60]);
    quad(-5,5,z,z+8,((z/8)&1)?[52,66,84]:[46,58,76]);
    quad(-5,-4.75,z,z+8,[90,220,230],0,.4);quad(4.75,5,z,z+8,[90,220,230],0,.4)}
  const b0=Math.floor((cz-12)/24)*24;
  for(let z=b0;z<cz+130;z+=24){const k=Math.round(z/24);[-1,1].forEach(s=>{const h=6+((k*7+(s>0?3:0))%5)*2.5,X=s*(15+((k*3)%3)*3);
    faces(boxF(X-4,X+4,0,h,z-5,z+5,[[70,92,110],[84,76,104],[64,104,104]][(k+(s>0?1:0)+9)%3],{ol:'rgba(8,20,30,.75)'}));
    faces(boxF(X-4.05,X+4.05,h-.4,h,z-5.05,z+5.05,[255,200,90],{em:1}))})}
  const l0=Math.floor((cz-12)/16)*16;
  for(let z=l0;z<cz+110;z+=16)[-1,1].forEach(s=>{faces(boxF(s*5.7-.1,s*5.7+.1,0,4.6,z-.1,z+.1,[40,52,64]));faces(boxF(s*5.7-.4,s*5.7+.4,4.6,4.9,z-.4,z+.4,[255,236,150],{em:1}))});
}
/* ================= общее ================= */
let pt=[],snd0=null,tNow=0,flashT=0,tracer=null,pointer={x:W*.5,y:H*.5};
const ST={cur:0,done:[0,0,0,0,0]};
function done(i){if(ST.done[i])return;ST.done[i]=1;try{parent.postMessage('doroga:ok:'+i,'*')}catch(e){}}
function snd(kind){try{const A=window.AudioContext||window.webkitAudioContext;if(!snd0)snd0=new A();const a=snd0,t=a.currentTime;
  if(kind==='shot'||kind==='bad'){const dur=kind==='shot'?.14:.2,len=Math.floor(a.sampleRate*dur),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let k=0;k<len;k++)d[k]=(Math.random()*2-1)*Math.pow(1-k/len,3);
    const n=a.createBufferSource();n.buffer=b;const f=a.createBiquadFilter();f.type='lowpass';f.frequency.value=kind==='shot'?3000:600;const g=a.createGain();g.gain.value=.3;n.connect(f);f.connect(g);g.connect(a.destination);n.start(t)}
  else{[660,880,1175].forEach((fq,i)=>{const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=fq;g.gain.setValueAtTime(0,t+i*.09);g.gain.linearRampToValueAtTime(.18,t+i*.09+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*.09+.5);o.connect(g);g.connect(a.destination);o.start(t+i*.09);o.stop(t+i*.09+.6)})}
}catch(e){}}
function burst(sx,sy,good){for(let k=0;k<26;k++){const a=Math.random()*6.28,s=120+Math.random()*320;pt.push({x:sx,y:sy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-80,l:0,m:.5+Math.random()*.4,c:good?['#ffe27a','#7be3a0','#fff'][k%3]:['#ff6a5a','#ffb09a','#fff'][k%3]})}}
function fx(dt){
  pt=pt.filter(p=>(p.l+=dt)<p.m);pt.forEach(p=>{p.vy+=500*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;x.globalAlpha=1-p.l/p.m;x.fillStyle=p.c;x.fillRect(p.x,p.y,6,6)});x.globalAlpha=1;
  if(tracer){tracer.l+=dt;if(tracer.l>.09)tracer=null;else{x.strokeStyle='rgba(255,236,160,.9)';x.lineWidth=4;x.beginPath();x.moveTo(930,610);x.lineTo(tracer.x,tracer.y);x.stroke()}}
}
function gun(){
  x.save();x.translate(1040,760);x.rotate(-.32);
  x.fillStyle='#232a31';x.strokeStyle='#0b0f13';x.lineWidth=3;
  x.beginPath();x.roundRect(-210,-34,330,50,10);x.fill();x.stroke();
  x.fillStyle='#161b20';x.beginPath();x.roundRect(110,-26,170,18,6);x.fill();x.stroke();
  x.fillStyle='#5b3b22';x.beginPath();x.roundRect(-330,-28,150,56,14);x.fill();x.stroke();
  x.fillStyle='#161b20';x.beginPath();x.roundRect(-40,10,44,100,10);x.fill();x.stroke();
  x.fillStyle='#4b5560';x.beginPath();x.roundRect(-60,-62,120,28,8);x.fill();x.stroke();
  if(flashT>0){const g=x.createRadialGradient(290,-18,2,290,-18,90);g.addColorStop(0,'#fff');g.addColorStop(.3,'#ffe27a');g.addColorStop(1,'rgba(255,120,20,0)');x.globalAlpha=Math.min(1,flashT*10);x.fillStyle=g;x.beginPath();x.arc(290,-18,90,0,7);x.fill();x.globalAlpha=1}
  x.restore();
}
function crosshair(){x.save();x.strokeStyle='rgba(255,255,255,.9)';x.lineWidth=2.5;x.beginPath();x.arc(pointer.x,pointer.y,14,0,7);x.moveTo(pointer.x-26,pointer.y);x.lineTo(pointer.x-12,pointer.y);x.moveTo(pointer.x+12,pointer.y);x.lineTo(pointer.x+26,pointer.y);x.moveTo(pointer.x,pointer.y-26);x.lineTo(pointer.x,pointer.y-12);x.moveTo(pointer.x,pointer.y+12);x.lineTo(pointer.x,pointer.y+26);x.stroke();x.restore()}
function shoot(px,py){flashT=.12;tracer={x:px,y:py,l:0};snd('shot')}
const lbl=s=>{const m=String(s).match(/^(\d+)\/(\d+)$/);return m?`f:${m[1]}:${m[2]}`:s};
/* ---- числовая прямая ---- */
const WK={tp:0,sp:0},U=6;
const clamp=v=>Math.max(-8,Math.min(8,Math.round(v*100)/100));
const walkCtrl=()=>`<div class="rd">Ты на отметке: <b id="rdv">${fmt(WK.tp)}</b></div><input type="range" id="sl" min="-8" max="8" step="0.01" value="${WK.tp}" aria-label="Положение на прямой"><div class="bs">${[['−1',-1],['−0,1',-.1],['−0,01',-.01],['+0,01',.01],['+0,1',.1],['+1',1]].map(b=>`<button class="mini" data-d="${b[1]}">${b[0]}</button>`).join('')}</div>`;
function walkNudge(d){WK.tp=clamp(WK.tp+d);const s=$('#sl');if(s)s.value=WK.tp;const r=$('#rdv');if(r)r.textContent=fmt(WK.tp)}
function walkScene(dt){
  WK.sp+=(WK.tp-WK.sp)*Math.min(1,dt*9);
  cam.x=0;cam.y=1.7;cam.z=WK.sp*U;cam.yaw=0;cam.pitch=.04;sky();env();
  for(let k=Math.max(-8,Math.floor(WK.sp)-1);k<=Math.min(8,Math.ceil(WK.sp)+19);k++){
    const z=k*U,zero=k===0,c=zero?[255,200,60]:[40,170,185];
    faces(boxF(-4.7,-4.3,0,3.5,z-.2,z+.2,[60,76,92],{ol:'rgba(8,20,30,.8)'}));faces(boxF(4.3,4.7,0,3.5,z-.2,z+.2,[60,76,92],{ol:'rgba(8,20,30,.8)'}));
    faces(boxF(-4.7,4.7,3.4,3.9,z-.2,z+.2,c,{em:1}));lab(String(k<0?'−'+(-k):k),0,4.6,z,zero?1.5:1.2,zero?'#ffe27a':'#fff')}
  for(let t=Math.max(-8,Math.floor(WK.sp*10)/10-.5);t<=Math.min(8,WK.sp+14);t+=.1){const r=Math.round(t*10)/10;if(Math.abs(r-Math.round(r))<.01)continue;const half=Math.abs(r*10%5)<.01,z=r*U;quad(half?-3.4:-1.6,half?3.4:1.6,z-.05,z+.05,[170,240,245],0,.5)}
  flush();hudLine(WK.sp);
}
function hudLine(pos){
  const X0=150,X1=W-150,Y=66,mp=v=>X0+(v+8)/16*(X1-X0);
  x.fillStyle='rgba(8,24,36,.78)';x.beginPath();x.roundRect(90,14,W-180,112,18);x.fill();
  x.strokeStyle='#8fe3ec';x.lineWidth=4;x.beginPath();x.moveTo(X0-24,Y);x.lineTo(X1+24,Y);x.stroke();
  x.textAlign='center';x.textBaseline='middle';x.fillStyle='#d9f6f8';
  for(let k=-8;k<=8;k++){x.lineWidth=k===0?5:3;x.beginPath();x.moveTo(mp(k),Y-(k===0?16:10));x.lineTo(mp(k),Y+(k===0?16:10));x.stroke();x.font=(k===0?'800 24px':'700 19px')+' Montserrat,sans-serif';x.fillText(k<0?'−'+(-k):String(k),mp(k),Y+34)}
  x.fillStyle='#ff5a4a';x.beginPath();x.moveTo(mp(pos),Y-4);x.lineTo(mp(pos)-12,Y-26);x.lineTo(mp(pos)+12,Y-26);x.fill();
  x.font='800 22px Montserrat,sans-serif';x.fillStyle='#fff';x.fillText(fmt(pos),mp(pos),Y-40);
  x.font='600 15px Montserrat,sans-serif';x.fillStyle='#9fd7dc';x.textAlign='left';x.fillText('◀ меньше',112,112);x.textAlign='right';x.fillText('больше ▶',W-112,112);
}
/* ---- сцена для мишеней ---- */
function baseScene(){cam.x=0;cam.y=1.9;cam.z=0;cam.yaw=Math.sin(tNow*.4)*.02;cam.pitch=.06;sky();env()}
function crateF(c,sz,col){return boxF(c.x-sz,c.x+sz,c.y-sz,c.y+sz,c.z-sz,c.z+sz,col,{ol:'#1b1208'})}
function hit(list,sz,px,py){let best=null,bd=1e9;list.forEach((c,i)=>{if(!c.alive)return;const q=P3([c.x,c.y,c.z]);if(q[2]<1)return;const sx=W/2+FC*q[0]/q[2],sy=H/2-FC*q[1]/q[2],h=sz*FC/q[2]*1.05;if(Math.abs(px-sx)<h&&Math.abs(py-sy)<h&&q[2]<bd){bd=q[2];best=i}});return best}

`<h3>Что такое числовая прямая</h3><p>Все числа живут на одной дороге. <b>Нуль</b> стоит посередине. Идёшь вперёд, числа становятся больше: 1, 2, 3… Идёшь назад, числа меньше: −1, −2, −3…</p><p>Между целыми числами тоже есть числа. Это дроби: 0,5 лежит ровно посередине между 0 и 1.</p><div class="ex"><b>Как играть:</b> двигай ползунок или жми кнопки. Красный флажок на шкале сверху показывает, где ты. Нужное число найдено? Жми «Встать здесь».</div>`,
`<h3>Какие бывают числа</h3><ul><li><b>Натуральные</b> — те, которыми считают: 1, 2, 3… Нуля и минусов среди них нет.</li><li><b>Целые</b> — натуральные, нуль и числа с минусом: −2, −1, 0, 1, 2… Дробей нет.</li><li><b>Дробные</b> — числа «между» целыми: 5,6; ${fr(3,4)}; −0,7.</li></ul><p>Целые и дробные вместе называют <b>рациональными</b> числами.</p><div class="ex"><b>Как узнать:</b> есть дробная часть? Тогда число дробное. Есть минус или нуль? Тогда оно целое, но не натуральное.</div><div class="ex"><b>Как играть:</b> целься мышкой или пальцем в ящик с нужным числом и стреляй касанием.</div>`,
`<h3>Одно число, разные дроби</h3><p>Половина — это ${fr(1,2)}, но и ${fr(2,4)}, и ${fr(4,8)}. Число то же самое, только кусочки мельче.</p><ul><li>Знаменатель умножили на 2, значит и числитель умножь на 2.</li><li>Знаменатель разделили на 3, значит и числитель раздели на 3. Это называется <b>сократить</b> дробь.</li></ul><div class="ex"><b>Как играть:</b> закрась нижнюю полоску так, чтобы закрашенная часть была той же длины, что и у верхней. Белая линия подскажет, где должен кончаться цвет.</div>`,
`<h3>Как дробь превратить в десятичную</h3><div class="key"><b>Самое главное:</b> чтобы дробь стала десятичной, её надо просто <b>РАЗДЕЛИТЬ</b>: числитель на знаменатель. Чёрточка дроби — это знак деления.<br>${fr(3,4)} = 3 : 4 = 0,75</div><p>Но 3 на 4 «целыми» не делится: меньше одной штуки на человека. Поможет мелочь. Делим <b>3 рубля поровну на 4 человек</b>:</p><ul><li><b>Меняем на мелкие.</b> Каждый рубль — это 10 монет по 10 копеек. Было 3 монеты, стало 30.</li><li><b>Раздаём по одной монете каждому,</b> пока хватает на всех. 30 монет: каждому по 7 (раздали 28), осталось 2. Семь монет по 10 копеек — это 0,7. Первая цифра ответа: 7.</li><li><b>Остаток меняем на ещё более мелкие.</b> Каждая из 2 монет по 10 копеек — это 10 монет по 1 копейке. Стало 20 монет, каждому по 5, остатка нет. Вторая цифра: 5.</li></ul><p>Получилось 0,75. Так и делится любая дробь.</p><p><b>Когда остановиться:</b></p><ul><li>Осталось <b>0</b>: всё поделено. ${fr(3,4)} = 0,75.</li><li>Осталось <b>столько же, сколько уже оставалось раньше</b>: дальше цифры пойдут по кругу. Круг (период) пишут один раз в скобках: ${fr(1,3)} = 0,(3).</li></ul><div class="ex"><b>Пример ${fr(1,3)}:</b> 1 рубль на 3 человек. Меняем: 10 монет. Каждому по 3, осталась 1. Осталась 1, как и в самом начале, значит снова 10 и снова по 3: цифра 3 повторяется. Ответ 0,(3).</div><div class="ex"><b>Как играть:</b> жми «Разменять на мелкие», потом «Раздать по монете каждому», пока на всех не хватает. Остаток снова меняй на мелкие. Когда всё поделено или остаток повторился, запиши ответ в строку.</div>`,

   if(dp>0)lab(String(dp),px,2.8,14.5,.5,'#fff')}
  for(let i=0;i<pile;i++){
   if(lvl===0){const cx=((i%8)-3.5)*.8,cz=6+Math.floor(i/8)*.8;faces(boxF(cx-.33,cx+.33,0,.16,cz-.33,cz+.33,col,{ol:'#3d2a05'}))}
   else{const cx=((i%10)-4.5)*.36,cz=5.6+Math.floor(i/10)*.36;faces(boxF(cx-.15,cx+.15,0,.1,cz-.15,cz+.15,col,{ol:'#3d2a05'}))}}
  lab(pile+' монет · '+cn(lvl),0,.2,4.7,.3,'#fff');
  if(n)lab('0,'+digs,0,4,14,1,q.rep?'#ffb3aa':'#fff');
  flush()}};
/* 5. Сравнение */
const PR=[['0,013','0,1004','Запиши с одинаковым числом знаков: 0,0130 и 0,1004.'],['−3,24','−3,42','У чисел с минусом больше то, что ближе к нулю.'],['3/8','0,375','Переведи 3/8 в десятичную дробь: 3 : 8 = 0,375.'],['1,37','1,(37)','Выпиши цифры: 1,3700… и 1,3737…']];
const BT=[{lo:1/8,hi:1/7,t:`Встань на число между ${fr(1,8)} и ${fr(1,7)}`,h:'1/8 = 0,125, а 1/7 ≈ 0,143. Нужно число правее первого и левее второго.'},{lo:1/6,hi:1/5,t:`Встань на число между ${fr(1,6)} и ${fr(1,5)}`,h:'1/6 ≈ 0,167, а 1/5 = 0,2. Нужно число между ними.'}];
MS[4]={th:TH[4],i:0,msg:'',good:0,
 init(){this.i=0;this.msg='';this.good=0;WK.tp=WK.sp=0;this.mk()},
 mk(){const p=PR[this.i];if(!p)return;this.cr=[{lab:lbl(p[0]),x:-3.3,y:1.9,z:9,alive:true,s:0},{lab:lbl(p[1]),x:3.3,y:1.9,z:9,alive:true,s:1}]},
 body(){if(ST.done[4])return win('Готово! Ты умеешь сравнивать любые рациональные числа. Кстати, число π не рациональное: его нельзя записать дробью. В 7 классе мы такие числа не используем.',4);
  if(this.i<PR.length)return`<div class="task">${this.i+1} из ${PR.length+BT.length}. Подстрели <b>большее</b> число. Если числа равны, жми «Равны».</div><button class="btn alt" data-act="eqb">Равны</button><div class="fb ${this.good?'g':'b'}">${this.msg}</div>`;
  const b=BT[this.i-PR.length];return`<div class="task">${this.i+1} из ${PR.length+BT.length}. ${b.t}</div>${walkCtrl()}<button class="btn" data-act="stand">Встать здесь</button><div class="fb ${this.good?'g':'b'}">${this.msg}</div>`},
 next(msg){this.i++;this.good=1;this.msg=msg;if(this.i>=PR.length+BT.length){done(4);renderAll();return}if(this.i===PR.length){WK.tp=WK.sp=0}else if(this.i<PR.length)this.mk();setBody()},
 act(a){if(this.i>=PR.length+BT.length)return;const p=PR[this.i];
  if(a==='eqb'&&p){const c=cmp(parse(p[0]),parse(p[1]));if(c===0){snd('ok');this.next('Верно, числа равны: '+p[0]+' = '+p[1]+'.')}else{snd('bad');this.good=0;this.msg='Числа не равны. '+p[2];setBody()}}
  else if(a==='stand'&&!p){const b=BT[this.i-PR.length],r=Math.round(WK.tp*100)/100;if(r>b.lo&&r<b.hi){snd('ok');this.next('Верно! '+fmt(r)+' лежит между ними.')}else{snd('bad');this.good=0;this.msg='Пока нет. '+b.h;setBody()}}},
 click(px,py){if(this.i>=PR.length||ST.done[4])return;shoot(px,py);const p=PR[this.i],i=hit(this.cr,1.6,px,py);if(i===null)return;const c=this.cr[i],q=P3([c.x,c.y,c.z]),sx=W/2+FC*q[0]/q[2],sy=H/2-FC*q[1]/q[2],cc=cmp(parse(p[0]),parse(p[1]));
  if(cc!==0&&((c.s===0&&cc>0)||(c.s===1&&cc<0))){burst(sx,sy,1);snd('ok');this.next('Верно! '+(cc>0?p[0]:p[1])+' больше.')}
  else{burst(sx,sy,0);snd('bad');this.good=0;this.msg=cc===0?'Эти числа равны! Нажми «Равны».':'Нет, это меньшее число. '+p[2];setBody()}},
 draw(dt){if(this.i>=PR.length){walkScene(dt);return}baseScene();this.cr.forEach(c=>{faces(crateF(c,1.6,[200,134,62]));lab(c.lab,c.x,c.y,c.z-1.65,1.3,'#fff')});flush();flashT=Math.max(0,flashT-dt);gun();fx(dt);crosshair()}};
/* ================= каркас ================= */
const side=$('#side');
const tabsHTML=()=>`<div class="tabs">${[1,2,3,4,5].map((n,i)=>`<button class="tab${i===ST.cur?' on':''}${ST.done[i]?' ok':''}" data-tab="${i}">${n}</button>`).join('')}</div>`;
function setBody(){const b=$('#body');if(b)b.innerHTML=MS[ST.cur].body()}
function renderAll(){side.innerHTML=tabsHTML()+`<div class="th">${MS[ST.cur].th}</div><div id="body"></div>`;setBody()}
function go(i){ST.cur=i;MS[i].init&&MS[i].init();renderAll()}
side.addEventListener('click',e=>{const b=e.target.closest('[data-act],[data-d],[data-tab]');if(!b)return;
  if(b.dataset.tab!==undefined)return go(+b.dataset.tab);
  if(b.dataset.d!==undefined)return walkNudge(+b.dataset.d);
  if(b.dataset.act==='next')return go(Math.min(4,ST.cur+1));
  MS[ST.cur].act&&MS[ST.cur].act(b.dataset.act)});
side.addEventListener('input',e=>{if(e.target.id==='sl'){WK.tp=+e.target.value;const r=$('#rdv');if(r)r.textContent=fmt(WK.tp)}});
side.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='dans')MS[3].act('dchk')});
function toCanvas(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*W/r.width,y:(e.clientY-r.top)*H/r.height}}
cv.addEventListener('pointermove',e=>{pointer=toCanvas(e)});
cv.addEventListener('pointerdown',e=>{pointer=toCanvas(e);const m=MS[ST.cur];m.click&&m.click(pointer.x,pointer.y)});
function fit(){const r=$('#stage'),k=Math.min(r.clientWidth/W,r.clientHeight/H)||1;cv.style.width=W*k+'px';cv.style.height=H*k+'px'}
if(window.ResizeObserver)new ResizeObserver(fit).observe($('#stage'));addEventListener('resize',fit);fit();
let last=performance.now();
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;tNow+=dt;MS[ST.cur].draw(dt);requestAnimationFrame(loop)}
MS.forEach(m=>m.init&&0);go(0);requestAnimationFrame(loop);
</script>
