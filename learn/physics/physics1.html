<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Лаборатория явлений</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#070b18;--cy:#5ee0ff;--am:#ffb84d;--gr:#58ff9a;--rd:#ff6b7d;--glass:rgba(12,18,42,.78)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--ink);overflow:hidden;font-family:'Onest',system-ui,sans-serif;color:#eaf1ff}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.12)}
h1,h2{font-family:'Unbounded',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em}
button{font-family:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(135deg,var(--cy),#7aa8ff);color:#06122b;font-weight:700;font-size:16px;padding:14px 22px;border-radius:14px;width:100%}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.4}

#hud{position:fixed;top:0;left:0;right:0;padding:max(10px,env(safe-area-inset-top)) 14px 0;display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:3}
#name{font-family:'Unbounded',sans-serif;font-weight:500;font-size:14px;padding:8px 14px;border-radius:999px}
#dots{display:flex;gap:5px;padding:10px 12px;border-radius:999px}
#dots i{width:16px;height:6px;border-radius:3px;background:rgba(255,255,255,.2);transition:.4s}
#dots i.on{background:var(--am);width:26px}
#dots i.done{background:var(--cy)}
#meter{position:fixed;top:62px;left:14px;right:14px;height:6px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden;z-index:3;transition:opacity .4s}
#fill{height:100%;width:0;background:linear-gradient(90deg,var(--cy),var(--gr));border-radius:3px;transition:width .2s}
#readout{position:fixed;top:78px;left:50%;transform:translateX(-50%);padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;z-index:3;transition:opacity .3s;white-space:nowrap}
#hint{position:fixed;left:14px;right:14px;bottom:max(18px,env(safe-area-inset-bottom));text-align:center;padding:12px 16px;border-radius:16px;font-size:14.5px;line-height:1.4;z-index:3;transition:opacity .4s}
.hide{opacity:0!important;pointer-events:none!important}

#card{position:fixed;left:12px;right:12px;bottom:max(12px,env(safe-area-inset-bottom));max-width:520px;margin:0 auto;border-radius:24px;padding:20px 20px 18px;z-index:5;transform:translateY(130%);transition:transform .7s cubic-bezier(.2,.9,.2,1);max-height:68vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#card.show{transform:none}
#ctag{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--cy);padding:5px 12px 5px 10px;border-radius:999px;background:rgba(94,224,255,.12)}
#ctag:before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cy);box-shadow:0 0 10px var(--cy)}
#ctitle{font-size:20px;line-height:1.2;margin:12px 0 8px}
#ctext{font-size:15.5px;line-height:1.55;color:#d6e1ff;max-width:60ch}
#cfact{margin:14px 0 16px;padding:10px 14px;border-left:3px solid var(--am);background:rgba(255,184,77,.09);border-radius:0 12px 12px 0;font-size:14px;line-height:1.5;color:#ffe3b3}

.screen{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;padding:16px;z-index:6;transition:opacity .6s}
.panel{width:100%;max-width:520px;border-radius:26px;padding:26px 22px 22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#menu h1{font-size:30px;line-height:1.05;margin-bottom:6px;background:linear-gradient(120deg,#fff,var(--cy) 60%,var(--am));-webkit-background-clip:text;background-clip:text;color:transparent}
#menu .sub{color:var(--am);font-weight:600;font-size:14px;margin-bottom:14px}
#menu p{font-size:15.5px;line-height:1.55;color:#d6e1ff;margin-bottom:10px}
#menu ul{list-style:none;margin:12px 0 18px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
#menu li{font-size:13.5px;padding:9px 11px;border-radius:12px;background:rgba(255,255,255,.07)}
#quiz{align-items:center;background:rgba(5,8,20,.55)}
#qtop{font-size:13.5px;color:var(--am);font-weight:600;margin-bottom:10px}
#qtext{font-size:18px;line-height:1.4;font-weight:600;margin-bottom:16px}
#qbtns{display:grid;gap:9px}
.qb{background:rgba(255,255,255,.09);color:#eaf1ff;font-size:16px;font-weight:600;padding:14px;border-radius:14px;border:1.5px solid rgba(255,255,255,.14);text-align:left}
.qb.ok{background:rgba(88,255,154,.18);border-color:var(--gr)}
.qb.bad{background:rgba(255,107,125,.18);border-color:var(--rd)}
#qfb{font-size:14.5px;line-height:1.5;color:#d6e1ff;margin:14px 0;min-height:44px}
#qfb b{color:#fff}
.big{font-family:'Unbounded',sans-serif;font-size:46px;font-weight:700;color:var(--am);margin:6px 0 10px}
@media (prefers-reduced-motion:reduce){#card{transition:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud">
  <div id="name" class="glass"></div>
  <div id="dots" class="glass"></div>
</div>
<div id="meter" class="hide"><div id="fill"></div></div>
<div id="readout" class="glass hide"></div>
<div id="hint" class="glass hide"></div>

<div id="card" class="glass">
  <span id="ctag"></span>
  <h2 id="ctitle"></h2>
  <p id="ctext"></p>
  <div id="cfact"></div>
  <button class="btn" id="cnext">Дальше</button>
</div>

<div id="menu" class="screen">
  <div class="panel glass">
    <h1>Лаборатория явлений</h1>
    <div class="sub">§ 1. Что изучает физика</div>
    <p>Физика изучает изменения в природе — явления. Здесь их можно потрогать: крути, тащи, грей и смотри, что произойдёт.</p>
    <ul>
      <li>Движение шара</li><li>Нагревание воды</li><li>Отражение света</li><li>Электризация</li><li>Магнит</li><li>Проверка: физика, химия или биология?</li>
    </ul>
    <button class="btn" id="start">Начать опыты</button>
  </div>
</div>

<div id="quiz" class="screen hide">
  <div class="panel glass" id="qpanel"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const V3=THREE.Vector3,UP=new V3(0,1,0);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const rnd=(a,b)=>a+Math.random()*(b-a);
const ease=t=>t*t*(3-2*t);
const mat=(c,o={})=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.5,metalness:.1},o));
function mesh(g,m,x=0,y=0,z=0){const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o}
function label(txt,{color='#fff',w=2.4,fs=56}={}){
  const c=document.createElement('canvas');c.width=512;c.height=128;const x=c.getContext('2d');
  x.font=`700 ${fs}px Onest,system-ui,sans-serif`;x.textAlign='center';x.textBaseline='middle';
  x.shadowColor='rgba(0,0,0,.85)';x.shadowBlur=10;x.fillStyle=color;x.fillText(txt,256,64);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));
  s.scale.set(w,w/4,1);s.renderOrder=10;return s}
const _d=new V3();
function setB(m,A,B){_d.subVectors(B,A);const L=_d.length()||.001;m.position.copy(A).add(B).multiplyScalar(.5);m.scale.set(1,L,1);m.quaternion.setFromUnitVectors(UP,_d.divideScalar(L))}

/* ---------- сцена ---------- */
const canvas=$('#c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
const scene=new THREE.Scene();scene.background=new THREE.Color(0x070b18);scene.fog=new THREE.Fog(0x070b18,22,60);
const cam=new THREE.PerspectiveCamera(50,1,.1,120);
scene.add(new THREE.HemisphereLight(0x9bb7ff,0x1a1420,.75));
const sun=new THREE.DirectionalLight(0xffffff,1.1);sun.position.set(4,10,6);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8});scene.add(sun);

const tableTex=(()=>{const c=document.createElement('canvas');c.width=c.height=1024;const x=c.getContext('2d');
  const g=x.createRadialGradient(512,512,0,512,512,512);g.addColorStop(0,'#2a386a');g.addColorStop(1,'#141b38');
  x.fillStyle=g;x.fillRect(0,0,1024,1024);x.strokeStyle='rgba(120,160,255,.15)';x.lineWidth=2;
  for(let i=0;i<=26;i++){const p=i*1024/26;x.beginPath();x.moveTo(p,0);x.lineTo(p,1024);x.moveTo(0,p);x.lineTo(1024,p);x.stroke()}
  return new THREE.CanvasTexture(c)})();
const sideM=mat(0x10162f,{roughness:.6});
const table=new THREE.Mesh(new THREE.CylinderGeometry(6.5,6.7,.4,72),[sideM,new THREE.MeshStandardMaterial({map:tableTex,roughness:.45,metalness:.25}),sideM]);
table.position.y=-.2;table.receiveShadow=true;scene.add(table);
const rim=new THREE.Mesh(new THREE.TorusGeometry(6.52,.045,8,96),new THREE.MeshBasicMaterial({color:0x5ee0ff}));rim.rotation.x=Math.PI/2;scene.add(rim);
{const sp=[];for(let i=0;i<600;i++){const r=rnd(28,50),a=rnd(0,6.283);sp.push(Math.cos(a)*r,rnd(-6,34),Math.sin(a)*r)}
 const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(sp,3));
 scene.add(new THREE.Points(g,new THREE.PointsMaterial({color:0x9bb7ff,size:.25,fog:false})))}

/* ---------- ввод ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2(),plane=new THREE.Plane(UP,0),_o=new V3();
function pt(e,h=0){const r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(ndc,cam);plane.constant=-h;return ray.ray.intersectPlane(plane,_o)?_o.clone():null}

/* ---------- состояние ---------- */
let state='menu',cur=null,idx=0,zoomT=0,micro=0,tt=0;
const tPos=new V3(0,9,12),lookC=new V3(0,0,0),tLook=new V3(0,.5,0);

/* ======================= СТАНЦИЯ 1: ШАР КАТИТСЯ ======================= */
function st1(){
  const g=new THREE.Group(),R=.6,LIM=5.3;
  const c=document.createElement('canvas');c.width=512;c.height=256;const x=c.getContext('2d');
  for(let i=0;i<8;i++){x.fillStyle=i%2?'#ffffff':'#ff7a2f';x.fillRect(i*64,0,64,256)}
  x.fillStyle='#1b2a6b';x.fillRect(0,100,512,56);
  const ball=mesh(new THREE.SphereGeometry(R,40,28),new THREE.MeshStandardMaterial({map:new THREE.CanvasTexture(c),roughness:.3,metalness:.1}),-2.5,R,2.2);
  g.add(ball);
  const v=new V3(),pins=[];
  for(let i=0;i<6;i++){const a=i/6*6.283+.4;
    const p=mesh(new THREE.CylinderGeometry(.18,.26,.9,16),mat(0xffffff,{roughness:.3}),Math.cos(a)*3.2,.45,Math.sin(a)*3.2-.3);
    const rg=new THREE.Mesh(new THREE.TorusGeometry(.21,.04,8,20),mat(0xff3b5c));rg.rotation.x=Math.PI/2;rg.position.y=.22;p.add(rg);
    p.v=new V3();p.hit=false;p.fall=0;p.axis=new V3();g.add(p);pins.push(p)}
  const N=300,tp=new Float32Array(N*3),tg=new THREE.BufferGeometry();
  tg.setAttribute('position',new THREE.BufferAttribute(tp,3));tg.setDrawRange(0,0);
  const tm=new THREE.PointsMaterial({color:0x5ee0ff,size:.18,transparent:true,opacity:.9,depthWrite:false,blending:THREE.AdditiveBlending});
  const trail=new THREE.Points(tg,tm);trail.frustumCulled=false;g.add(trail);
  let tn=0,last=ball.position.clone(),dist=0,hits=0,p0=null,p1=null;
  const arrow=new THREE.ArrowHelper(new V3(1,0,0),new V3(),1,0xffd24d,.4,.3);arrow.visible=false;g.add(arrow);
  const aim=new THREE.ArrowHelper(new V3(1,0,0),new V3(),1,0x5ee0ff,.4,.3);aim.visible=false;g.add(aim);
  const S={grp:g,name:'Движение',prog:0,
    hint:'Проведи пальцем по экрану — шар получит щелчок. Сбивай кегли!',
    home:{pos:new V3(0,8,9),look:new V3(0,0,.4)},
    card:{tag:'Механическое явление',title:'Движение — это смена места',
      text:'Шар катится: с каждой секундой его положение относительно стола меняется. Если тело меняет место — значит, происходит механическое явление. Скорость постепенно падает из-за трения.',
      fact:'Так же движутся велосипедист, автомобиль и облака в небе.'},
    zoom:()=>({pos:ball.position.clone().add(new V3(0,2.4,3.6)),look:ball.position.clone()}),
    down(e){p0=pt(e,.1);p1=p0&&p0.clone()},
    move(e){if(!p0)return;p1=pt(e,.1)||p1;const d=p1.clone().sub(p0);d.y=0;const L=d.length();
      if(L>.05){aim.visible=true;aim.position.set(ball.position.x,.3,ball.position.z);aim.setDirection(d.normalize());aim.setLength(Math.min(L,5)+.2,.35,.25)}},
    up(){if(p0&&p1){v.copy(p1).sub(p0);v.y=0;v.multiplyScalar(2.2);if(v.length()>11)v.setLength(11)}p0=p1=null;aim.visible=false},
    update(dt){
      let sp=v.length();
      if(sp>.02){
        ball.position.addScaledVector(v,dt);
        ball.rotateOnWorldAxis(new V3().crossVectors(UP,v).normalize(),sp*dt/R);
        dist+=sp*dt;v.multiplyScalar(Math.max(0,1-.45*dt));v.setLength(Math.max(0,v.length()-.3*dt));
        const r=Math.hypot(ball.position.x,ball.position.z);
        if(r>LIM){const nx=ball.position.x/r,nz=ball.position.z/r,vn=v.x*nx+v.z*nz;
          if(vn>0){v.x-=1.7*vn*nx;v.z-=1.7*vn*nz}ball.position.x=nx*LIM;ball.position.z=nz*LIM}
        if(ball.position.distanceTo(last)>.3){const i=tn%N;tp[i*3]=ball.position.x;tp[i*3+1]=.08;tp[i*3+2]=ball.position.z;tn++;
          tg.attributes.position.needsUpdate=true;tg.setDrawRange(0,Math.min(tn,N));last.copy(ball.position)}
      } else v.set(0,0,0);
      sp=v.length();
      for(const p of pins){
        if(!p.hit){const dx=p.position.x-ball.position.x,dz=p.position.z-ball.position.z,d=Math.hypot(dx,dz);
          if(d<R+.22&&sp>.2){p.hit=true;hits++;const dir=new V3(dx,0,dz).normalize();
            p.v.copy(v).multiplyScalar(.9).addScaledVector(dir,1.5);p.v.y=0;p.axis.crossVectors(UP,dir).normalize();v.multiplyScalar(.82)}}
        else{p.fall=Math.min(1,p.fall+dt*3);p.quaternion.setFromAxisAngle(p.axis,p.fall*1.45);
          p.position.y=.45-p.fall*.27;p.position.x+=p.v.x*dt;p.position.z+=p.v.z*dt;p.v.multiplyScalar(Math.max(0,1-2.5*dt))}}
      if(sp>.15){arrow.visible=true;arrow.position.set(ball.position.x,1.6,ball.position.z);
        arrow.setDirection(v.clone().normalize());arrow.setLength(.4+sp*.35,.35,.25)}else arrow.visible=false;
      tm.size=.18+.2*micro;
      S.prog=clamp(dist/14+hits*.05);
      ro(`Пройдено: ${dist.toFixed(1)} м · кегли: ${hits}/6`.replace(' · ',', '))}};
  return S}

/* ======================= СТАНЦИЯ 2: НАГРЕВАНИЕ ======================= */
function st2(){
  const g=new THREE.Group(),cg=new THREE.Group();cg.position.y=1;g.add(cg);
  const steel=mat(0x8a93b8,{metalness:.8,roughness:.3});
  for(let i=0;i<3;i++){const a=i*2.094+.5;g.add(mesh(new THREE.CylinderGeometry(.05,.05,1,8),steel,Math.cos(a)*1.45,.5,Math.sin(a)*1.45))}
  const ring=mesh(new THREE.TorusGeometry(1.45,.06,10,40),steel,0,.98,0);ring.rotation.x=Math.PI/2;g.add(ring);
  g.add(mesh(new THREE.CylinderGeometry(.38,.5,.55,24),mat(0x6b7bd6,{roughness:.2}),0,.28,0));
  const flame=new THREE.Mesh(new THREE.ConeGeometry(.22,.45,16),new THREE.MeshBasicMaterial({color:0xff9a2e,transparent:true,opacity:.9}));
  flame.position.y=.78;g.add(flame);
  const fl=new THREE.PointLight(0xff8a3a,0,7);fl.position.set(0,.8,0);g.add(fl);
  const glassM=new THREE.MeshPhysicalMaterial({color:0xd8ecff,transparent:true,opacity:.2,roughness:.05,side:THREE.DoubleSide,depthWrite:false});
  const cup=new THREE.Mesh(new THREE.CylinderGeometry(1.5,1.3,2.4,48,1,true),glassM);cup.position.y=1.2;cg.add(cup);
  const base=new THREE.Mesh(new THREE.CylinderGeometry(1.3,1.3,.1,48),glassM);base.position.y=.05;cg.add(base);
  const waterM=new THREE.MeshPhysicalMaterial({color:0x3aa0ff,transparent:true,opacity:.45,roughness:.1,depthWrite:false});
  const water=new THREE.Mesh(new THREE.CylinderGeometry(1.4,1.3,1.6,48),waterM);water.position.y=.9;cg.add(water);
  const blue=new THREE.Color(0x3aa0ff),iceC=new THREE.Color(0xe2f8ff);
  /* молекулы H2O */
  const mg=new THREE.Group();cg.add(mg);
  const mO=new THREE.MeshStandardMaterial({color:0xff4d5e,roughness:.3}),mH=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.3});
  const gO=new THREE.SphereGeometry(.1,16,12),gH=new THREE.SphereGeometry(.06,12,10),mols=[];
  for(let ix=0;ix<4;ix++)for(let iy=0;iy<4;iy++)for(let iz=0;iz<4;iz++){
    const m=new THREE.Group();m.add(new THREE.Mesh(gO,mO));
    const h1=new THREE.Mesh(gH,mH);h1.position.set(.11,.08,0);const h2=new THREE.Mesh(gH,mH);h2.position.set(-.11,.08,0);m.add(h1,h2);
    m.home=new V3(-.75+ix*.5,.35+iy*.4,-.75+iz*.5);m.position.copy(m.home);
    m.v=new V3(rnd(-1,1),rnd(-1,1),rnd(-1,1)).normalize();m.th=Math.random();mg.add(m);mols.push(m)}
  /* пар */
  const SN=70,sp=new Float32Array(SN*3),sl=new Float32Array(SN),sg=new THREE.BufferGeometry();
  for(let i=0;i<SN;i++)sp[i*3+1]=-99;sg.setAttribute('position',new THREE.BufferAttribute(sp,3));
  const steam=new THREE.Points(sg,new THREE.PointsMaterial({color:0xffffff,size:.55,transparent:true,opacity:.25,depthWrite:false}));steam.frustumCulled=false;g.add(steam);
  const bubs=[];for(let i=0;i<14;i++){const b=new THREE.Mesh(new THREE.SphereGeometry(.07,8,8),new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.6}));
    b.position.set(rnd(-.9,.9),rnd(.2,1.6),rnd(-.9,.9));b.visible=false;cg.add(b);bubs.push(b)}
  let T=-10,ph='ice',melt=0,boil=0,held=false;
  const S={grp:g,name:'Нагревание',prog:0,
    hint:'Зажми экран — загорится горелка. Отпусти — вода остывает.',
    home:{pos:new V3(0,4.8,8.2),look:new V3(0,1.8,0)},
    card:{tag:'Тепловое явление',title:'Лёд растаял, вода закипела',
      text:'Вещество осталось тем же — H₂O, поменялось только движение молекул. В льду они дрожат на месте, в воде скользят друг мимо друга, в паре разлетаются в стороны.',
      fact:'Замерзание воды — тоже тепловое явление, как сказано в параграфе.'},
    zoom:()=>({pos:new V3(0,2.3,3.5),look:new V3(0,1.9,0)}),
    down(){held=true},up(){held=false},
    update(dt){
      const hold=held||state==='zoom'||state==='card',h=hold?1:0;
      if(ph==='ice'){T=Math.max(-10,T+(h?14:-3)*dt);if(T>=0){T=0;ph='melt'}}
      else if(ph==='melt'){melt=clamp(melt+(h?.2:-.06)*dt);if(melt>=1)ph='water';else if(melt<=0&&!h){ph='ice';T=-.5}}
      else if(ph==='water'){T=Math.max(4,T+(h?16:-5)*dt);if(T>=100){T=100;ph='boil'}}
      else{boil=clamp(boil+(h?.3:-.25)*dt);if(boil<=0){ph='water';T=98}}
      S.prog=ph==='ice'?.2*(T+10)/10:ph==='melt'?.2+.25*melt:ph==='water'?.45+.35*clamp(T/100):(boil>=1?1:.8+.19*boil);

      flame.visible=!!h;flame.scale.set(1,1+.2*Math.sin(tt*32),1);fl.intensity=h?1.8:0;

      for(const m of mols){

      ro(`Температура ${Math.round(T)} °C, ${name}`)}};

 {t:'а) Расчёска, которой расчесали волосы, притянула мелкие кусочки бумаги',a:0,e:'Электрическое явление. Заряд появился, но вещество бумаги и пластика не изменилось.'},
 {t:'б) Весной появилась листва на деревьях',a:2,e:'Изменения происходят с живыми организмами — это биологическое явление.'},
 {t:'в) Солнечный луч отразился от зеркала, и на стене появился солнечный зайчик',a:0,e:'Световое явление — отражение света. Ты его только что сам запускал.'},
 {t:'г) Белая бумага на солнце пожелтела',a:1,e:'Под действием света в бумаге образуются новые вещества — это химическое явление.'},
 {t:'д) Кусок мела упал и раскрошился',a:0,e:'Изменились только форма и размер, а вещество осталось тем же. Это механическое явление.'},
 {t:'е) В кружке, которую забыли помыть, выросла плесень',a:2,e:'Плесень — живой организм, значит, явление биологическое.'}];
const OPT=['Физическое','Химическое','Биологическое'];
let qi=0,score=0;
function startQuiz(){cur&&scene.remove(cur.grp);cur=null;state='quiz';idx=ST.length;paintDots();
  $('#name').textContent='Проверка';showHud(false);qi=0;score=0;$('#quiz').classList.remove('hide');renderQ()}
function renderQ(){
  const q=Q[qi],p=$('#qpanel');
  p.innerHTML=`<div id="qtop">Задание 1 из учебника, пункт ${qi+1} из ${Q.length}</div><div id="qtext">${q.t}</div><div id="qbtns">${OPT.map((o,i)=>`<button class="qb" data-i="${i}">${o}</button>`).join('')}</div><div id="qfb"></div><button class="btn" id="qn" disabled>Дальше</button>`;
  p.querySelectorAll('.qb').forEach(b=>b.onclick=()=>{
    const i=+b.dataset.i;p.querySelectorAll('.qb').forEach(x=>x.disabled=true);
    p.querySelector(`[data-i="${q.a}"]`).classList.add('ok');
    if(i===q.a){score++;$('#qfb').innerHTML='<b>Верно!</b> '+q.e}else{b.classList.add('bad');$('#qfb').innerHTML='<b>Почти.</b> '+q.e}
    const n=$('#qn');n.disabled=false;n.textContent=qi<Q.length-1?'Дальше':'Результат';n.onclick=()=>{qi++;qi<Q.length?renderQ():renderEnd()}})}
function renderEnd(){
  const msg=score>=5?'Ты отлично разобрался в явлениях природы.':score>=3?'Неплохо! Перечитай в параграфе, чем различаются явления.':'Загляни в параграф ещё раз и попробуй снова — опыты помогут.';
  $('#qpanel').innerHTML=`<h2 style="font-size:22px">Задание выполнено</h2><div class="big">${score} из ${Q.length}</div><p style="font-size:15.5px;line-height:1.55;color:#d6e1ff;margin-bottom:12px">${msg}</p><p style="font-size:14px;line-height:1.5;color:#ffe3b3;margin-bottom:18px">Физика изучает физические явления: механические, тепловые, световые, электрические, магнитные. Химические и биологические явления изучают другие науки.</p><button class="btn" id="again">Пройти заново</button>`;
  $('#again').onclick=()=>{$('#quiz').classList.add('hide');$('#menu').classList.remove('hide');state='menu';load(0)}}

/* ---------- ввод и цикл ---------- */
canvas.addEventListener('pointerdown',e=>{if(state==='play'&&cur&&cur.down){canvas.setPointerCapture(e.pointerId);cur.down(e)}});
canvas.addEventListener('pointermove',e=>{if(state==='play'&&cur&&cur.move)cur.move(e)});
['pointerup','pointercancel'].forEach(n=>canvas.addEventListener(n,e=>{cur&&cur.up&&cur.up(e)}));
function resize(){const w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix()}
addEventListener('resize',resize);resize();
const fit=()=>clamp(.95/(innerWidth/innerHeight),1,2.3);
load(0);

let prevT=performance.now();
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(now-prevT)/1000);prevT=now;tt+=dt;
  if(cur){
    cur.update(dt);
    if(state==='play'){setProg(cur.prog);if(cur.prog>=1)startZoom()}
    if(state==='zoom'){zoomT+=dt;micro=ease(clamp(zoomT/2.2));if(zoomT>3.2)showCard()}
    if(state==='card')micro=1;
    if(state==='play')micro=0}
  const f=fit();
  if(state==='zoom'||state==='card'){const z=cur.zoom(),zf=1+(f-1)*.55;tPos.copy(z.pos).sub(z.look).multiplyScalar(zf).add(z.look);tLook.copy(z.look)}
  else if(state==='play'&&cur){tPos.copy(cur.home.pos).sub(cur.home.look).multiplyScalar(f).add(cur.home.look);tLook.copy(cur.home.look)}
  else{const a=tt*.12;tPos.set(Math.cos(a)*10*f*.8,6+f,Math.sin(a)*10*f*.8);tLook.set(0,.6,0)}
  const k=1-Math.exp(-dt*2.6);cam.position.lerp(tPos,k);lookC.lerp(tLook,k);cam.lookAt(lookC);
  renderer.render(scene,cam)}
requestAnimationFrame(loop);
</script>
</body>
</html>
